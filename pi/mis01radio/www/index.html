<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIS-01 电台</title>
<style>
:root { --bg:#14161a; --card:#1d2026; --line:#2c3038; --fg:#e4e6ea; --dim:#8a909c; --acc:#5fe0b8; --warn:#f0b24a; --bad:#f06a5a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
main { max-width:960px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:4px 0 14px; } h2 { font-size:16px; margin:0 0 10px; }
section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
button { background:#2a2f37; color:var(--fg); border:1px solid #3a404a; border-radius:7px; padding:6px 12px; font:inherit; cursor:pointer; }
button:hover { border-color:var(--acc); } button.pri { background:#1f4a3e; border-color:#2f7a64; }
button.danger:hover { border-color:var(--bad); color:var(--bad); }
input, select, textarea { background:#111317; color:var(--fg); border:1px solid #3a404a; border-radius:6px; padding:6px 8px; font:inherit; width:100%; }
textarea { font-family:ui-monospace, Consolas, monospace; font-size:13px; min-height:54px; }
label { display:block; margin:8px 0 3px; color:var(--dim); font-size:13px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.hint { color:var(--dim); font-size:12px; margin-top:3px; }
.err { color:var(--bad); font-size:13px; min-height:1em; }
.state { font-size:13px; padding:2px 8px; border-radius:10px; background:#2a2f37; }
.state.playing { background:#1f4a3e; color:var(--acc); } .state.retry, .state.stalled { background:#4a3a1f; color:var(--warn); }
.vfd { background:#0a0c0b; border-radius:8px; padding:10px 12px; display:inline-block; }
.vfd svg { display:block; }
.vfd.small { padding:3px 6px; border-radius:5px; }
table { width:100%; border-collapse:collapse; }
td { border-top:1px solid var(--line); padding:7px 4px; vertical-align:middle; }
td.ops { white-space:nowrap; text-align:right; }
tr.cur td { background:#1a2a26; }
.muted { color:var(--dim); }
#shot { width:100%; border:1px solid var(--line); border-radius:6px; cursor:crosshair; background:#000; min-height:120px; display:block; }
dialog { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px; width:min(560px, 94vw); padding:16px; }
dialog::backdrop { background:rgba(0,0,0,.6); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
@media (max-width:600px) { .grid2 { grid-template-columns:1fr; } td.type { display:none; } }
</style>
</head>
<body>
<main>
<h1>MIS-01 网络电台</h1>

<section>
  <div class="row" style="justify-content:space-between">
    <div>
      <div class="row"><b id="nowName">未播放</b><span id="nowState" class="state">停止</span></div>
      <div id="nowDetail" class="muted" style="font-size:13px"></div>
    </div>
    <div class="vfd" id="nowVfd"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <button onclick="post('/api/prev')">⏮ 上一台</button>
    <button id="btnPlay" class="pri" onclick="togglePlay()">▶ 播放</button>
    <button onclick="post('/api/next')">下一台 ⏭</button>
    <span style="flex:1"></span>
    <span class="muted">音量</span>
    <input id="vol" type="range" min="0" max="100" style="width:180px" onchange="post('/api/volume',{volume:+this.value})">
    <span id="volTxt" style="width:2.5em"></span>
  </div>
</section>

<section>
  <div class="row" style="justify-content:space-between"><h2>电台</h2><button onclick="editStation()">＋ 添加电台</button></div>
  <table id="list"></table>
  <div class="hint">“IV-18 文字”是这台在荧光管上显示的内容：8 位七段，“.” 并到前一位，“*” 显示为 °，显示不了 K M V W X Z。前面加空格可以右移。</div>
</section>

<section>
  <div class="row" style="justify-content:space-between">
    <h2>远程画面（Pi 上的浏览器）</h2>
    <div class="row"><button id="btnView" onclick="toggleView()">打开画面</button><button class="danger" onclick="post('/api/browser/close').then(()=>setView(false))">关浏览器</button></div>
  </div>
  <div class="hint">网页电台在 Pi 的浏览器里播放。第一次用或登录过期时，在这里打开画面登录：点图片就是点网页，文字框输入后按“发送”。</div>
  <div id="viewBox" style="display:none; margin-top:10px">
    <div class="row"><input id="url" placeholder="网址，例 https://www.br.de/radio/live/br24/" style="flex:1"><button onclick="openUrl()">打开</button><button onclick="post('/api/browser/back')">后退</button></div>
    <div class="muted" id="pageInfo" style="font-size:12px; margin:6px 0"></div>
    <img id="shot" alt="浏览器画面" onclick="shotClick(event)" onwheel="shotWheel(event)">
    <div class="row" style="margin-top:8px">
      <input id="typeTxt" placeholder="要输入的文字（先点一下网页里的输入框）" style="flex:1" onkeydown="if(event.key==='Enter'){sendText();event.preventDefault()}">
      <button onclick="sendText()">发送</button>
      <button onclick="key('Enter')">回车</button><button onclick="key('Tab')">Tab</button>
      <button onclick="key('Backspace')">退格</button><button onclick="key('Escape')">Esc</button>
      <button onclick="post('/api/browser/scroll',{dy:-400})">▲</button><button onclick="post('/api/browser/scroll',{dy:400})">▼</button>
    </div>
  </div>
</section>

<section>
  <h2>设置</h2>
  <div class="grid2">
    <div><label>声卡</label><select id="s_alsa_card"></select><div class="hint" id="cardInUse"></div></div>
    <div><label>混音</label><select id="s_alsa_dmix"><option value="1">经 dmix（默认）</option><option value="0">独占声卡</option></select></div>
    <div><label>代理（浏览器和 mpv 都用；留空不用）</label><input id="s_proxy" placeholder="http://192.168.1.2:10808"></div>
    <div><label>浏览器模式</label><select id="s_browser_mode"><option value="headless">无界面（默认）</option><option value="xvfb">虚拟屏幕 xvfb（无界面没声音时用）</option></select></div>
    <div><label>开机接着放上次的电台</label><select id="s_resume"><option value="0">否</option><option value="1">是</option></select></div>
    <div><label>浏览器空闲多久关闭（分钟）</label><input id="s_browser_idle_min" type="number" min="1"></div>
    <div><label>调音量时 IV-18 显示秒数</label><input id="s_vfd_volume_s" type="number" min="1" max="10"></div>
  </div>
  <div class="row" style="margin-top:10px"><button class="pri" onclick="saveSettings()">保存设置</button><span class="err" id="setErr"></span></div>
  <label>网页密码（<span id="pwState"></span>；用户名随便填）</label>
  <div class="row"><input id="pw" type="password" placeholder="新密码，留空 = 不要密码" style="flex:1"><button onclick="setPw()">设置密码</button></div>
</section>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle">电台</h2>
  <div class="grid2">
    <div><label>名字</label><input id="f_name"></div>
    <div><label>编号（小写字母、数字、- _）</label><input id="f_id"></div>
  </div>
  <label>类型</label><select id="f_type" onchange="renderFields()"></select>
  <label>IV-18 文字</label>
  <div class="row"><input id="f_vfd" style="flex:1; font-family:ui-monospace,Consolas,monospace" oninput="vfdLive()"><button onclick="tryVfd()">在 IV-18 上试显示</button></div>
  <div class="row" style="margin-top:6px"><div class="vfd" id="f_vfdPrev"></div><span class="err" id="f_vfdErr"></span></div>
  <div id="typeFields"></div>
  <label><input id="f_enabled" type="checkbox" style="width:auto"> 启用（参与上一台 / 下一台）</label>
  <div class="err" id="dlgErr"></div>
  <div class="row" style="justify-content:flex-end; margin-top:10px"><button onclick="dlg.close()">取消</button><button class="pri" onclick="saveStation()">保存</button></div>
</dialog>

<script>
// ---- IV-18 字形（与 ESP 固件 vfd_font.c、Pi vfdtext.py 同一张表）  a=1 b=2 c=4 d=8 e=16 f=32 g=64
const DIG = [0x3F,0x06,0x5B,0x4F,0x66,0x6D,0x7D,0x07,0x7F,0x6F];
const TWO = {C:0x39,c:0x58,H:0x76,h:0x74,O:0x3F,o:0x5C,U:0x3E,u:0x1C,I:0x30,i:0x04};
const ONE = {A:0x77,B:0x7C,D:0x5E,E:0x79,F:0x71,G:0x3D,J:0x1E,L:0x38,N:0x54,P:0x73,Q:0x67,R:0x50,S:0x6D,T:0x78,Y:0x6E};
const SYM = {' ':0,'-':0x40,'_':0x08,'=':0x48,"'":0x02,'"':0x22,'*':0x63};
function glyph(c) {
  if (c >= '0' && c <= '9') return DIG[c.charCodeAt(0) - 48];
  if (c in SYM) return SYM[c]; if (c in TWO) return TWO[c];
  const u = c.toUpperCase(); return (u in ONE) ? ONE[u] : -1;
}
// 返回 {segs:[8], err}；segs 每位 bit7 = 小数点
function toSegs(t) {
  const out = []; let err = null;
  if (t.trim().toUpperCase() === 'OFF') err = '不能是 OFF';
  if (t.includes('"')) err = '不能含双引号';
  for (const c of t) {
    if (c === '.') { if (!out.length || out[out.length-1] & 0x80) out.push(0x80); else out[out.length-1] |= 0x80; continue; }
    const g = glyph(c); if (g < 0) { err = err || `显示不了“${c}”`; out.push(0); } else out.push(g);
  }
  if (out.length > 8) err = err || `超过 8 位（${out.length} 位）`;
  while (out.length < 8) out.push(0);
  return {segs: out.slice(0, 8), err};
}
// 画一排七段（含最左 G1 位：只画点）
function vfdSvg(text, h, playing) {
  const {segs} = toSegs(text || ''); const w = h * 0.55, gap = h * 0.18, t = h * 0.1;
  const on = '#6ff5cf', off = '#16211e';
  const seg = (x, y, horiz, lit) => horiz
    ? `<rect x="${x+t*0.6}" y="${y-t/2}" width="${w-t*1.2}" height="${t}" rx="${t/2}" fill="${lit?on:off}"/>`
    : `<rect x="${x-t/2}" y="${y+t*0.6}" width="${t}" height="${h/2-t*1.2}" rx="${t/2}" fill="${lit?on:off}"/>`;
  let s = '', x = t;
  s += `<circle cx="${x+t}" cy="${h-t/2}" r="${t*0.6}" fill="${playing?on:off}"/>`; x += t * 3;
  for (const g of segs) {
    s += seg(x, t/2, 1, g & 1) + seg(x+w, t/2, 0, g & 2) + seg(x+w, h/2, 0, g & 4) + seg(x, h - t/2, 1, g & 8)
       + seg(x, h/2, 0, g & 16) + seg(x, t/2, 0, g & 32) + seg(x, h/2, 1, g & 64)
       + `<circle cx="${x+w+t*1.3}" cy="${h-t/2}" r="${t*0.55}" fill="${g&0x80?on:off}"/>`;
    x += w + gap;
  }
  return `<svg width="${x+t}" height="${h+t}" viewBox="0 -${t/2} ${x+t} ${h+t}">${s}</svg>`;
}

// ---- 数据
let S = null, editing = null, viewOn = false, shotBusy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: 'HTTP ' + r.status}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
async function post(path, body) {
  try { const j = await api(path, body || {}); if (j.status) showStatus(j.status); return j; }
  catch (e) { alert(e.message); }
}
async function load() {
  S = await api('/api/state'); renderList(); showStatus(S.status); renderSettings();
}
const STATE_TXT = {stopped:'停止', starting:'启动中', playing:'播放中', retry:'重试中', stalled:'没在播'};
function showStatus(st) {
  if (S) S.status = st;
  $('nowName').textContent = st.name || '未播放';
  const e = $('nowState'); e.textContent = STATE_TXT[st.state] || st.state; e.className = 'state ' + st.state;
  $('nowDetail').textContent = [st.title && ('♪ ' + st.title), st.detail].filter(Boolean).join('　');
  $('nowVfd').innerHTML = vfdSvg(st.vfd, 34, !!st.station);
  $('btnPlay').textContent = st.station ? '■ 停止' : '▶ 播放';
  if (document.activeElement !== $('vol')) $('vol').value = st.volume;
  $('volTxt').textContent = st.volume;
  document.querySelectorAll('#list tr').forEach(tr => tr.classList.toggle('cur', tr.dataset.id === st.station));
}
function togglePlay() {
  if (S.status.station) return post('/api/stop');
  const id = S.settings.last_id && S.stations.find(s => s.id === S.settings.last_id) ? S.settings.last_id : (S.stations[0] || {}).id;
  if (id) post('/api/play', {id});
}
function typeLabel(t) { return (S.types.find(x => x.type === t) || {label: t}).label; }
function renderList() {
  $('list').innerHTML = S.stations.map((s, i) => `<tr data-id="${esc(s.id)}">
    <td style="width:36px"><button onclick="post('/api/play',{id:'${esc(s.id)}'})" title="播放">▶</button></td>
    <td><b>${esc(s.name)}</b>${s.enabled === false ? ' <span class="muted">（未启用）</span>' : ''}<div class="muted" style="font-size:12px">${esc(s.id)}</div></td>
    <td class="type muted" style="font-size:13px">${esc(typeLabel(s.type))}</td>
    <td><div class="vfd small">${vfdSvg(s.vfd, 16, false)}</div></td>
    <td class="ops"><button onclick="move(${i},-1)">↑</button> <button onclick="move(${i},1)">↓</button>
      <button onclick="editStation('${esc(s.id)}')">编辑</button> <button class="danger" onclick="delStation('${esc(s.id)}')">删除</button></td></tr>`).join('')
    || '<tr><td class="muted">还没有电台</td></tr>';
  if (S.status) showStatus(S.status);
}
async function move(i, d) {
  const ids = S.stations.map(s => s.id); const j = i + d; if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]]; await post('/api/station/order', {ids}); load();
}
async function delStation(id) {
  if (!confirm('删除电台 ' + id + '？')) return; await post('/api/station/delete', {id}); load();
}

// ---- 编辑对话框（类型字段由服务端 FIELDS 决定）
const dlg = $('dlg');
function editStation(id) {
  editing = id ? S.stations.find(s => s.id === id) : null;
  const s = editing || {id:'', name:'', type: S.types[0].type, vfd:'', enabled:true};
  $('dlgTitle').textContent = editing ? '编辑电台' : '添加电台';
  $('f_name').value = s.name; $('f_id').value = s.id; $('f_vfd').value = s.vfd; $('f_enabled').checked = s.enabled !== false;
  $('f_type').innerHTML = S.types.map(t => `<option value="${t.type}">${esc(t.label)}</option>`).join('');
  $('f_type').value = s.type; $('typeFields').innerHTML = ''; renderFields(s); vfdLive(); $('dlgErr').textContent = '';
  dlg.showModal();
}
function renderFields(s) {
  s = s || {}; const t = S.types.find(x => x.type === $('f_type').value);
  const cur = {}; document.querySelectorAll('#typeFields [data-key]').forEach(e => cur[e.dataset.key] = e.value);
  $('typeFields').innerHTML = t.fields.map(f => {
    const v = esc(s[f.key] ?? cur[f.key] ?? '');
    const inp = f.multiline ? `<textarea data-key="${f.key}">${v}</textarea>` : `<input data-key="${f.key}" value="${v}">`;
    return `<label>${esc(f.label)}${f.required ? ' *' : ''}</label>${inp}<div class="hint">${esc(f.hint || '')}</div>`;
  }).join('');
}
function vfdLive() {
  const t = $('f_vfd').value, r = toSegs(t);
  $('f_vfdPrev').innerHTML = vfdSvg(t, 26, false); $('f_vfdErr').textContent = r.err || '';
}
async function tryVfd() {
  try { await api('/api/vfd/preview', {text: $('f_vfd').value}); } catch (e) { $('f_vfdErr').textContent = e.message; }
}
async function saveStation() {
  const st = {name: $('f_name').value, id: $('f_id').value, type: $('f_type').value, vfd: $('f_vfd').value, enabled: $('f_enabled').checked};
  if (!st.id) st.id = st.name.toLowerCase().replace(/[^a-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32);
  document.querySelectorAll('#typeFields [data-key]').forEach(e => st[e.dataset.key] = e.value);
  try { await api('/api/station/save', {station: st, old_id: editing ? editing.id : ''}); dlg.close(); load(); }
  catch (e) { $('dlgErr').textContent = e.message; }
}

// ---- 设置
const SETS = ['alsa_card', 'alsa_dmix', 'proxy', 'browser_mode', 'resume', 'browser_idle_min', 'vfd_volume_s'];
function renderSettings() {
  const st = S.settings;
  $('s_alsa_card').innerHTML = '<option value="auto">自动（找耳机口 ES8316）</option>' +
    S.cards.map(c => `<option value="${esc(c.id)}">${esc(c.id)} — ${esc(c.desc)}</option>`).join('');
  for (const k of SETS) { const e = $('s_' + k); e.value = typeof st[k] === 'boolean' ? (st[k] ? '1' : '0') : st[k]; }
  $('cardInUse').textContent = '当前用：' + S.card_in_use;
  $('pwState').textContent = st.has_password ? '已设置' : '未设置，局域网内谁都能改';
}
async function saveSettings() {
  const d = {};
  for (const k of SETS) {
    const v = $('s_' + k).value, old = S.settings[k];
    d[k] = typeof old === 'boolean' ? v === '1' : typeof old === 'number' ? +v : v;
  }
  try { await api('/api/settings', d); $('setErr').textContent = '已保存'; load(); } catch (e) { $('setErr').textContent = e.message; }
}
async function setPw() {
  const pw = $('pw').value;
  if (!confirm(pw ? '设置新密码？之后浏览器会要求输入（用户名随便填）。' : '取消密码？')) return;
  await post('/api/password', {password: pw}); $('pw').value = ''; load();
}

// ---- 远程画面
function setView(on) {
  viewOn = on; $('viewBox').style.display = on ? '' : 'none'; $('btnView').textContent = on ? '收起画面' : '打开画面';
  if (on) refreshShot();
}
async function toggleView() {
  if (viewOn) return setView(false);
  await post('/api/browser/open', {}); setView(true);
}
async function openUrl() { await post('/api/browser/open', {url: $('url').value}); setTimeout(refreshShot, 800); }
async function refreshShot() {
  if (!viewOn || shotBusy) return; shotBusy = true;
  try {
    const r = await fetch('/api/browser/shot');
    if (r.ok) { const u = URL.createObjectURL(await r.blob()); const img = $('shot'); const old = img.src; img.src = u; if (old.startsWith('blob:')) URL.revokeObjectURL(old); }
    const info = await api('/api/browser/info'); $('pageInfo').textContent = info.title ? `${info.title} — ${info.url}` : (info.url || '');
  } catch (e) { $('pageInfo').textContent = e.message; }
  shotBusy = false;
}
function shotClick(ev) {
  const r = ev.target.getBoundingClientRect();
  post('/api/browser/click', {x: (ev.clientX - r.left) / r.width, y: (ev.clientY - r.top) / r.height}).then(() => setTimeout(refreshShot, 400));
}
function shotWheel(ev) { ev.preventDefault(); post('/api/browser/scroll', {dy: ev.deltaY}); }
async function sendText() { await post('/api/browser/type', {text: $('typeTxt').value}); $('typeTxt').value = ''; setTimeout(refreshShot, 300); }
async function key(k) { await post('/api/browser/key', {key: k}); setTimeout(refreshShot, 400); }

setInterval(() => { api('/api/status').then(showStatus).catch(() => {}); }, 3000);
setInterval(refreshShot, 1500);
load().catch(e => document.body.insertAdjacentHTML('afterbegin', `<p class="err">${esc(e.message)}</p>`));
</script>
</body>
</html>
