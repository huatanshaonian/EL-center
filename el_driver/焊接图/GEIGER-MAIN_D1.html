<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEIGER-MAIN D1 焊接图</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--muted:#6b6a64;--card:#fff;--line:#dcdad3;--pcb:#0f4d2c;--silk:#f3f1e8;--pad:#c9a646;--hl:#e8483b;--done:#9a9890}
@media (prefers-color-scheme: dark){:root{--bg:#161614;--fg:#ecebe6;--muted:#9a9890;--card:#1f1f1c;--line:#34332f;--pcb:#0d3d24;--silk:#e9e6da;--pad:#b8963c;--hl:#ff6a5c;--done:#6b6a64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:17px;margin:0}.note{color:var(--muted);font-size:13px;flex-basis:100%}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn.on{background:var(--fg);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);height:calc(100vh - 62px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#view{height:60vh}}
#view{background:var(--pcb);position:relative;overflow:hidden}svg{width:100%;height:100%}
.ol{fill:none;stroke:#ffd84a;stroke-linecap:round}.olf{fill:none}
.st,.sb{fill:none;stroke:var(--silk);stroke-linecap:round;stroke-linejoin:round;opacity:.85}.stf,.sbf{fill:var(--silk);opacity:.85}
.pad{fill:var(--pad);opacity:.9}.pad.hole{stroke:#000;stroke-opacity:.35;stroke-width:.15}
.pad.p1{fill:#e2c25a}.pad.dim{opacity:.25}.pad.sel{fill:var(--hl);opacity:1}
.box{fill:none;stroke:var(--hl);stroke-width:.35;stroke-dasharray:1 .6}
#list{overflow:auto;border-left:1px solid var(--line)}
.grp{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.grp:hover{background:var(--card)}.grp.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}
.grp .v{font-weight:600}.grp .d{grid-column:2;color:var(--muted);font-size:12.5px;word-break:break-all}
.grp .m{grid-column:2;color:var(--muted);font-size:12px}
.grp.done .v,.grp.done .d{color:var(--done);text-decoration:line-through}
.grp.skip{opacity:.55}.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.grp .loc{grid-column:2;font-size:12.5px}.cell{display:inline-block;font-weight:700;border:1px solid var(--fg);border-radius:4px;padding:0 5px;margin-right:4px}
.loc .warn{color:var(--hl)}.loc .q{color:var(--muted)}
.ov{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.blk{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.blk:hover{background:var(--card)}
.blk.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}.blk .bn{font-weight:600}.blk .bc{color:var(--muted);font-size:12px;margin-left:6px}
.blk .bt,.grp .ex{display:none;font-size:13px;line-height:1.6;margin-top:4px;white-space:pre-wrap}
.blk.act .bt{display:block}.grp.act .ex{display:block;grid-column:2}
.tips{display:block;margin-top:4px;color:var(--hl)}.ex .pd{display:block}.ex .pd b{font-weight:600}
.chip{display:inline-block;font-size:12px;border:1px solid var(--hl);color:var(--hl);border-radius:10px;padding:0 7px;margin:4px 4px 0 0;cursor:pointer}
.sec.tg{cursor:pointer}
.th{grid-column:3;grid-row:1/span 3;width:80px;height:80px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
.idn{grid-column:2;font-size:12.5px;color:var(--muted)}.band{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid #0006;vertical-align:-2px;margin-right:2px}
#pic{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#pic img{max-width:90vw;max-height:90vh;background:#fff;border-radius:6px}
.sec{padding:6px 12px;font-size:12px;color:var(--muted);background:var(--bg);position:sticky;top:0;border-bottom:1px solid var(--line)}
#tip{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>GEIGER-MAIN D1 焊接图</h1>
<button class="btn on" id="bTop">正面（顶层）</button><button class="btn" id="bBot">背面（底层，镜像）</button>
<button class="btn" id="bSort">按格子排</button><span id="prog" style="color:var(--muted)"></span>
<div class="note">点右侧一行：板上对应位置变红。勾选＝这一组焊完了（存在本机浏览器里）。方焊盘/偏亮的焊盘是 1 脚。方框里是元件柜格子（“按格子排”可以一格一格取料）。点开一行能看到每个元件的作用；最上面“电路说明”讲每一块电路的原理，点一块板上就高亮那一块；点板上的焊盘会跳到它那一行。首次通电前 VR1 拧到 10 Ω；Q6（S8050）焊前定脚。LS1/LS2 二选一。</div></header>

 "y": -42.0, "w": 1.524, "h": 1.524, "a": 0, "s": "C", "th": true, "l": "T", "net": "FB0"}, {"n": "2", "x": 28.5, "y": -42.0, "w": 1.524, "h": 1.524, "a": 0, "s": "C", "th": true, "l": "T", "net": "GND"}, {"n": "3", "x": 31.0, "y": -42.0, "w": 1.524, "h": 1.524, "a": 0, "s": "C", "th": true, "l": "T", "net": "GND"}]}}, "hasLoc": true, "copies": 1, "when": "2026-10-27 09:48"}, N = {"board": "GEIGER-MAIN D1", "overview": "这块板给 J305 盖革管供约 400 V 高压，把放电脉冲变成“咔哒”声。电分两路：J1 的 +5V_HV（电源板 HV-C，受高压钮子控制）只给高压部分；J2 的 +5V 常电（ESP32 底板）给咔哒和蜂鸣器，高压关着也能报警。高压部分：U1 TLC555 + Q1 KSP44 + 10 mH 电感做反激升压，Q3 限流，LM393 + TL431 + 88 MΩ 分压闭环稳在 400 V，经 J_HV 送夹子板；夹子板的 GM、PULSE 经 J3 回来：PULSE 直通 J2 给 ESP32 计数，GM 触发 U4 单稳，经 Q6 让蜂鸣器响 1.1 ms；BZ 线管静音和报警。", "blocks": [{"name": "电源输入与去耦", "refs": ["J1", "J2", "C10", "C11", "C12", "C13"], "text": "两路 5 V 分开进板。J1（XH-2P：1 +5V_HV，2 GND）接电源板 PCB-3 的 HV-C，只给高压部分（U1、Q1、L1、U2、U3）供电，高压钮子或 HV_EN 一关这一路就断，升压停止。J2（XH-4P：1 +5V 常电，2 GND，3 PULSE，4 BZ）接 ESP32 底板，+5V 给 U4 单稳、蜂鸣器和 GM 上拉 R3：报警（包括掉电预警 PFAIL）要在高压关着时也能响，所以这部分不能接 HV-C。两路地在板上相连。C10 100 µF 电解 + C11 100 nF 在 +5V_HV 上：升压时电感每个周期要抽 30–40 mA 的尖峰电流，平均只有约 2.7 mA，尖峰由 C10 就近供给，C11 滤高频。C12 47 µF + C13 100 nF 在 +5V 上，给蜂鸣器的电流脉冲就近供电。", "tips": "C10、C12 是电解电容，有极性：外壳色条一侧是负极，长脚是正极，对准丝印。J1、J2 方向按丝印。第一次通电用限流电源：J1 接 5 V / 0.2 A（测试清单第 7 节），J2 接 5 V 常电。仿真：HV-C 硬开时 C10 充电浪涌约 3–6 A、0.1 ms，保险不会动作，但会让上游 5 V 瞬间下陷。"}, {"name": "升压振荡器与开关管", "refs": ["U1", "R1", "R5", "D2", "C3", "R9", "C15", "R6", "Q1"], "text": "沿用 MightyOhm 盖革计数器的接法，U1（TLC555）不是普通的方波振荡：6 脚 THRES 接地，555 自己不会结束“开”，只能靠 4 脚 RESET 被拉低来关。3 脚 OUT 为高时经 R6 1 kΩ 给 Q1（KSP44）基极约 4 mA，Q1 导通，L1 里电流慢慢上升；电流到上限时 Q3 把 RESET 拉低，OUT 立刻变低，7 脚 DISCH 同时把 Q1 基极拉到地，Q1 关得快。之后 C3 1 nF 经 R9 220 kΩ 放电，约 0.2 ms 降到 Vcc/3 触发 2 脚 TRIG，OUT 再变高并经 R5 1 kΩ + D2 把 C3 快速充满，开始下一周期。所以“开”的时间由电流上限决定，“关”的时间由 R9×C3 决定，频率约 3.5–4.1 kHz。R1 是 RESET 上拉。R6 原版 330 Ω，5 V 供电改 1 kΩ。Q1 用 KSP44（VCBO 500 V）替代停产的 FJN3303F。", "tips": "U1 是 DIP-8，缺口/圆点对丝印 1 脚。Q1 脚序 1 E、2 B、3 C，平面方向按丝印；它的 C 脚关断时在 400 V 以上。D2 色环（阴极）朝 TR 网络一侧，按丝印。C3 是 1 kV 瓷片，无极性。"}, {"name": "峰值电流限制", "refs": ["Q3", "R8", "VR1"], "text": "Q1 的发射极经 R8 15 Ω 和 VR1（10 Ω 多圈电位器，接成可变电阻）到地，电感电流流过它们产生电压。电压到 Q3（2N3904）的导通电压约 0.6 V 时，Q3 导通把 U1 的 RESET 拉低，Q1 关断。于是每个周期电感都充到同一个峰值电流 Ipk ≈ 0.585 V ÷（15 Ω + VR1）：VR1 10 Ω 时 23.4 mA，0 Ω 时 38.9 mA，与电源电压无关。电感每次存 ½·L·Ipk² 的能量，VR1 越小，能量越大，开环电压越高。这是原版 MightyOhm 唯一的调压手段；本板外面又加了闭环，这里就成了“最大功率限制 + 保护”：即使反馈坏了，开环电压也被 VR1 限住，不会击穿 Q1。仿真：VR1 拧到 0 Ω 附近时开环可冲到 500 V 以上，超过 KSP44 的 VCBO 500 V。", "tips": "第一次通电前先把 VR1 拧到 10 Ω（丝印“1st: VR1=10R”），3296W 出厂位置不定，断电量 VR1 两端确认。调法按测试清单第 7 节：VR2 先拧到 0（闭环约 470 V 封顶），再慢慢减小 VR1，TP1 读到约 44–45 V（约 430–440 V）就停，不要追到 450 V 以上；再调 VR2 到 400 V。Q3 脚序 1 E、2 B、3 C。"}, {"name": "反激储能与高压整流", "refs": ["L1", "D1", "C1", "J_HV"], "text": "Q1 导通时 5 V 加在 L1（10 mH 工字电感）上，电流上升，能量存进磁场；Q1 一关，电感要维持电流，下端（网络 SWG）电压猛地往上冲，经 D1（UF4007）把能量倒进 C1。这叫反激：电压不由匝数比决定，而是一直冲到能把能量送出去为止，所以 5 V 能升到几百伏。C1 10 nF/1 kV 聚丙烯薄膜电容（漏电小）把一次次的电荷攒成平稳的 HV，经 J_HV 焊线送到夹子板。D1 必须是快恢复管：UF4007 耐压 1 kV、恢复 75 ns；hforsten 实测普通 1N4007 恢复太慢、噪声大，不能用。单级整流只需一只高压二极管和一只高压电容。L1 规格书没给饱和电流，要实测：示波器看 R8 上电流波形末端有没有急剧上翘。开环最高电压主要由电感自身的寄生电容决定，板与板会不同。", "tips": "高压危险：HV、SWG（L1 下端、Q1 集电极、D1、C1、J_HV）工作时约 400 V。C1 储能约 0.8 mJ，不致命但会电一下。断电后等 ≥ 4 s（到 10 V 约 3.9 s）再碰，用表确认高压点 < 30 V，必要时用放电棒。单手操作，表笔先夹地。D1 色环（阴极）朝 C1/HV 一侧。主板右前安装孔 (55,5) 离 400 V 点只有 1.4–1.8 mm，这个角用尼龙螺丝和尼龙柱；J_HV 焊点套热缩，用耐压线。"}, {"name": "闭环稳压（分压、基准、比较器）", "refs": ["R80", "R81", "R82", "R83", "R44", "VR2", "C30", "U3", "R41", "R42", "R43", "U2"], "text": "只靠限流，高压会随温度（约 −1.3 V/°C）、电感个体和表的负载变，所以加了“够了就停”的闭环。R80–R83 四只 22 MΩ（共 88 MΩ）和下臂 R44 470 kΩ + VR2 200 kΩ（接成可变电阻）把 HV 按比例缩到约 2.5 V，送到 U2（LM393 比较器）的负输入 FBN；U3（TL431，阴极接参考端）经 R41 供电，给出 2.495 V 基准，经 R42 100 kΩ 送到正输入 REFP。HV 超过设定值，LM393 的开集电极输出把 U1 RESET 拉低，555 停振，HV 回落再放行（突发模式，纹波约 3.4 Vpp）。HV = 2.495 ×（1 + 88 M ÷（470 k + VR2）），可调约 330–469 V。R43 10 MΩ 从输出接回 REFP 形成回差。LM393 另一路输入接地不用。C30 滤开关噪声。每只 22 MΩ 承受约 100 V（额定 1.6 kV）；分压链兼作泄放，关断后 C1 按约 1 s 时间常数放电。", "tips": "R80–R83 是 Vishay VR25 高压电阻，别和普通电阻混。FBN、F1–F3 是高阻节点，焊后用 IPA 洗净助焊剂，否则漏电会让高压漂。U2 对丝印 1 脚，LM393 直接焊死、拔不了，所以按测试清单先调 VR1 再调 VR2：TP1 读约 40.8 V 即 400 V。禁止用表笔量分压点 FBN：表的负载会让闭环把高压往上推。U3 TL431 平面方向按丝印。"}, {"name": "高压测试点", "refs": ["R90", "R91", "R92", "R93", "TP1", "TP2"], "text": "表笔直接碰 400 V 既危险又会带来约 40 µA 负载。这里单独做一条测试链：R90–R93 四只 22 MΩ（共 88 MΩ）从 HV 接到 TP1，TP2 是地。用输入电阻 10 MΩ 的数字表（DC 200 V 档）量 TP1–TP2，表的内阻成了分压下臂：HV = 读数 × 9.8，400 V 读约 40.8 V；11 MΩ 的表系数是 9.0。测量电流只有约 4 µA，闭环会自动补偿（仿真接表后 HV 只低 0.27 V）。测试链平时不接表、没有电流，所以 TP1 实际浮在接近 400 V（经 88 MΩ，碰到只有微安级，只影响读数），要当高压对待。", "tips": "先把黑表笔夹在 TP2，再夹 TP1，然后上电读数；断电等 ≥ 4 s 再拆表笔。焊前逐只量 R90–R93，按实际值算系数：(R90+R91+R92+R93+表内阻)÷表内阻。表内阻不是 10 MΩ 的先查说明书。"}, {"name": "夹子板接口与 GM 整形", "refs": ["J3", "R3", "C74", "J2"], "text": "J3（XH-3P：1 GND、2 GM、3 PULSE）用 3 芯短线接夹子板 J4，脚序一一对应。夹子板上的两只三极管都是开集电极（只会往地拉，不会输出高电平），上拉电阻放在接收端：GM 由本板 R3 10 kΩ 上拉到 +5V 常电，管子放电时被拉低，送去触发 U4 单稳；PULSE 在本板不接上拉，从 J3-3 直通 J2-3，由 ESP32 底板的 10 kΩ 上拉到 3.3 V（加 1 nF），下降沿计数。C74 470 pF 接在 GM 对地：仿真发现开关节点 SWG 到 GM 只要 1 pF 的寄生电容就会连续误咔哒，加 470 pF 后 2 pF 也不误触发，正常脉冲照样触发；试过 1 nF，Q2 拉不动，不用。", "tips": "J3 与夹子板 J4 的 GND、GM、PULSE 要一一对应，线束远离 Q1、L1、D1。台架上不接 ESP 底板时 PULSE 没有上拉，量不到脉冲（推断），看 GM 或听咔哒即可。"}, {"name": "咔哒单稳", "refs": ["U4", "R70", "C70", "C73"], "text": "GM 每被拉低一次（低于约 1/3 电源电压），U4（TLC555 接成单稳，即“触发一下就输出一段固定长度的高电平”）的 3 脚就输出 1.1 × R70 × C70 = 1.1 × 10 kΩ × 100 nF ≈ 1.1 ms 的高电平，推 Q6 让蜂鸣器“嗒”一声，6、7 脚接在一起由 R70 充电、C70 定时。为什么是 1.1 ms：CAJOE 套件用 52 ms，太长，会在上升、下降沿各响一下成“双响”；想更脆可把 C70 改 47 nF（约 0.5 ms）。计数率超过约 900 cps 时声音会连成一片，但不影响 ESP32 计数。4 脚 RESET 就是“咔哒使能 EN”，由 BZ 线经 RC 得到。必须用 CMOS 555：NE555 的 RESET 输入电流约 0.1–0.4 mA，100 kΩ 的 RC 带不动。C73 接 5 脚 CV 对地（推断：稳定门限、防噪声）。整个咔哒由硬件直接产生，不经 ESP32。", "tips": "U4 与 U1 同为 TLC555IP，缺口对丝印 1 脚，不要换成 NE555。"}, {"name": "BZ 单线控制（咔哒使能）", "refs": ["R71", "R72", "R73", "C71", "R79", "JP1"], "text": "ESP32 只用一根 BZ 线（J2-4，3.3 V）同时管静音和报警。BZ 经 R71 1 kΩ 到节点 BZP，R72 100 kΩ 把它弱下拉到地，再经 R73 100 kΩ 给 C71 1 µF 充电，C71 上的电压就是 U4 的 RESET（EN）：BZ 持续高，EN 约 3.3 V，咔哒开；BZ 低，EN 慢慢放到 0，约 0.2 s 后静音。R73×C71 ≈ 0.1 s 的时间常数把报警方波滤成平均值，方波另走交流耦合支路去响蜂鸣器。BZ 高阻时由 ESP 底板跳线 JP_BZ 决定（10 k 上拉 = 咔哒开，默认）；本板 R72 用 100 kΩ，比 10 k 大得多，不影响跳线。JP1 + R79 10 kΩ 是台架测试用：插短路帽后 EN 经 R79 接 +5V，咔哒强制常开；接 ESP32 时拔掉（否则约 14 µA 经 R73/R71 倒灌进 ESP 引脚）。已知副作用：静音时发报警，约 0.15 s 后 EN 升到 1.3–1.6 V，期间也会响咔哒。", "tips": "C71 是 1 µF 电解，有极性，负极接地，按丝印。JP1 默认不插短路帽。台架单测没接 ESP 底板时 BZ 悬空，被 R72 拉低 = 静音，要听咔哒就插 JP1。仿真：BZ 低→高约 41–62 ms 后咔哒生效，高→低 0.1–0.2 s 后静音。"}, {"name": "蜂鸣器驱动与报警支路", "refs": ["Q6", "R75", "R76", "R74", "C72", "D3", "LS1", "R77", "LS2", "D4"], "text": "Q6（S8050）当开关：基极有电流时集电极拉到地，蜂鸣器（一端接 +5V 常电，另一端 BZN 接 Q6 集电极）通电。基极有两路输入：一是咔哒，U4 输出经 R75 2.2 kΩ，基极电流约 1.9 mA，能饱和；二是报警，ESP32 的 2–4 kHz 方波经 R74 2.2 kΩ、C72 100 nF 交流耦合进基极，D3 把基极负半周钳到地。报警支路不经过 EN，所以静音不影响报警。R74 放在 C72 前面是仿真后改的：原来电容在前，BZ 每个下降沿 ESP 引脚峰值约 80 mA，改后约 2 mA。R76 10 kΩ 基极下拉，没信号时 Q6 可靠关断。蜂鸣器二选一：LS1 压电片 PS1740P02E（4 kHz，电流很小）配 R77 1 kΩ 并联帮它放电（TDK 推荐）；LS2 电磁式 YS-MBZ12085C05R42（2.048 kHz，更响，峰值约 120 mA）配 D4 续流，吸收线圈断电时的反冲电压。两套焊位十字交叉、共用中心。", "tips": "只焊一套：LS1+R77 或 LS2+D4。选 LS2 时 R74 改 470 Ω、C72 改 1 µF，否则报警很弱、Q6 发热。S8050 不同厂家有 EBC、ECB 两种脚序，焊前用万用表二极管档定脚（本板 1 E、2 B、3 C），用错会让蜂鸣器常通、线圈过流。D3 色环朝 Q6 基极一侧，D4 色环朝 +5V 一侧；LS2 的 + 脚接 +5V。BZ 由低变高时会轻“嗒”一声，属正常。"}], "parts": {"C1": "10 nF/1 kV 聚丙烯高压电容，储存 400 V 输出", "C3": "U1 关断时间定时电容 1 nF，配 R9 约 0.2 ms", "C30": "1 nF，滤掉反馈分压点 FBN 上的开关噪声", "C10": "+5V_HV 储能电解 100 µF，供升压的尖峰电流", "C11": "+5V_HV 高频去耦 100 nF", "C13": "+5V 常电高频去耦 100 nF", "C15": "U1 的 5 脚 CV 对地电容（推断：稳定门限）", "C70": "U4 单稳定时电容 100 nF，配 R70 定 1.1 ms", "C72": "报警支路交流耦合电容，只让方波通过", "C73": "U4 的 5 脚 CV 对地电容（推断：防噪声）", "C12": "+5V 常电储能电解 47 µF，供蜂鸣器电流脉冲", "C71": "咔哒使能 EN 的 RC 电容 1 µF，静音延时约 0.2 s", "C74": "GM 对地 470 pF，防开关噪声耦合造成误咔哒", "D1": "UF4007 快恢复高压整流二极管，SWG→HV", "D2": "U1 输出经它快速充满 C3，放电只能走 R9", "D3": "把 Q6 基极的负半周钳到地", "D4": "电磁式蜂鸣器续流二极管（只在用 LS2 时焊）", "J1": "XH-2P：1 +5V_HV（PCB-3 HV-C），2 GND", "J2": "XH-4P 接 ESP32 底板：+5V、GND、PULSE、BZ", "J3": "XH-3P 接夹子板 J4：GND、GM、PULSE", "JP1": "台架跳线：插上咔哒强制常开，接 ESP 时拔掉", "J_HV": "400 V 输出焊点，耐压线焊到夹子板 J_HVI", "TP1": "高压测试点，经 88 MΩ 接 HV，读数×9.8=高压", "TP2": "测试点地，万用表黑表笔先夹这里", "L1": "10 mH 储能电感，反激升压的核心", "LS1": "主选压电蜂鸣片 4 kHz（与 LS2 二选一）", "LS2": "备选电磁式蜂鸣器 2.048
