<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLANT D1.1 焊接图</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--muted:#6b6a64;--card:#fff;--line:#dcdad3;--pcb:#0f4d2c;--silk:#f3f1e8;--pad:#c9a646;--hl:#e8483b;--done:#9a9890}
@media (prefers-color-scheme: dark){:root{--bg:#161614;--fg:#ecebe6;--muted:#9a9890;--card:#1f1f1c;--line:#34332f;--pcb:#0d3d24;--silk:#e9e6da;--pad:#b8963c;--hl:#ff6a5c;--done:#6b6a64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:17px;margin:0}.note{color:var(--muted);font-size:13px;flex-basis:100%}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn.on{background:var(--fg);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);height:calc(100vh - 62px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#view{height:60vh}}
#view{background:var(--pcb);position:relative;overflow:hidden}svg{width:100%;height:100%}
.ol{fill:none;stroke:#ffd84a;stroke-linecap:round}.olf{fill:none}
.st,.sb{fill:none;stroke:var(--silk);stroke-linecap:round;stroke-linejoin:round;opacity:.85}.stf,.sbf{fill:var(--silk);opacity:.85}
.pad{fill:var(--pad);opacity:.9}.pad.hole{stroke:#000;stroke-opacity:.35;stroke-width:.15}
.pad.p1{fill:#e2c25a}.pad.dim{opacity:.25}.pad.sel{fill:var(--hl);opacity:1}
.box{fill:none;stroke:var(--hl);stroke-width:.35;stroke-dasharray:1 .6}
#list{overflow:auto;border-left:1px solid var(--line)}
.grp{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.grp:hover{background:var(--card)}.grp.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}
.grp .v{font-weight:600}.grp .d{grid-column:2;color:var(--muted);font-size:12.5px;word-break:break-all}
.grp .m{grid-column:2;color:var(--muted);font-size:12px}
.grp.done .v,.grp.done .d{color:var(--done);text-decoration:line-through}
.grp.skip{opacity:.55}.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.grp .loc{grid-column:2;font-size:12.5px}.cell{display:inline-block;font-weight:700;border:1px solid var(--fg);border-radius:4px;padding:0 5px;margin-right:4px}
.loc .warn{color:var(--hl)}.loc .q{color:var(--muted)}
.ov{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.blk{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.blk:hover{background:var(--card)}
.blk.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}.blk .bn{font-weight:600}.blk .bc{color:var(--muted);font-size:12px;margin-left:6px}
.blk .bt,.grp .ex{display:none;font-size:13px;line-height:1.6;margin-top:4px;white-space:pre-wrap}
.blk.act .bt{display:block}.grp.act .ex{display:block;grid-column:2}
.tips{display:block;margin-top:4px;color:var(--hl)}.ex .pd{display:block}.ex .pd b{font-weight:600}
.chip{display:inline-block;font-size:12px;border:1px solid var(--hl);color:var(--hl);border-radius:10px;padding:0 7px;margin:4px 4px 0 0;cursor:pointer}
.sec.tg{cursor:pointer}
.sec{padding:6px 12px;font-size:12px;color:var(--muted);background:var(--bg);position:sticky;top:0;border-bottom:1px solid var(--line)}
#tip{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>SLANT D1.1 焊接图</h1>
<button class="btn on" id="bTop">正面（顶层）</button><button class="btn" id="bBot">背面（底层，镜像）</button>
<button class="btn" id="bSort">按格子排</button><span id="prog" style="color:var(--muted)"></span>
<div class="note">点右侧一行：板上对应位置变红。勾选＝这一组焊完了（存在本机浏览器里）。方焊盘/偏亮的焊盘是 1 脚。方框里是元件柜格子（“按格子排”可以一格一格取料）。点开一行能看到每个元件的作用；最上面“电路说明”讲每一块电路的原理，点一块板上就高亮那一块；点板上的焊盘会跳到它那一行。Pico 插针装：先焊背面两条 1×20 排母（推子、编码器之前），排针焊在 Pico 上，Pico 芯片面朝外、1 脚对方焊盘。</div></header>

x": 95.62, "y": -17.31, "w": 1.6, "h": 1.6, "a": 90, "s": "C", "th": true, "l": "T", "net": "LAMP2"}, {"n": "18", "x": 98.16, "y": -17.31, "w": 1.6, "h": 1.6, "a": 90, "s": "C", "th": true, "l": "T", "net": "LAMP1"}]}}, "hasLoc": true, "copies": 1, "when": "2026-10-27 07:18"}, N = {"board": "SLANT D1.1", "overview": "斜面输入板装在机器前斜面上。主控是一块 Raspberry Pi Pico（插在两条排母上），由一根 Micro-USB 线从 Hub 模块取电，操作也经这根 USB 报给主机（推断）。板上分几部分：6 个带灯按键经上拉和阻容去抖接 GP2–GP7；3 个编码器的 A、B、按压共 9 路去抖，接 GP14–GP22；2 个推子和 1 个模式开关（按 6 档接）用 ADC（把电压变成数字）读 GP26–GP28；按键灯用 12 V，由 ULN2803 在 GP8–GP13 控制下接地点亮，12 V 从 PCB-3 的 J_KEYL 经 J_12V 进来。推子、编码器装在朝面板的顶层，其余在背面。", "blocks": [{"name": "Pico 主控与调试口", "refs": ["U1", "J_DBG", "C3V"], "text": "U1 是 Raspberry Pi Pico。它不从本板取电：电源走自己的 Micro-USB 口，线接 Hub 模块（W32）；网表里 Pico 的 VBUS、VSYS 脚都不接，所以本板的 12 V 和 Pico 只是共地。Pico 的 3V3(OUT)（36 脚，Pico 自带稳压器输出的 3.3 V）给全部按键、编码器的上拉电阻供电，C3V 100 nF 就近滤掉这条线上的高频毛刺。ADC_VREF（35 脚，ADC 参考电压）和 AGND（33 脚，模拟地）给推子、模式开关用。J_DBG 引出 GP0、GP1 和 GND，是 UART0 调试串口：DBG_TX 是 Pico 发、DBG_RX 是 Pico 收，接 USB 转串口模块时 TX 对 RX 交叉（推断）。D1.1 起 Pico 改成插针装：板背面焊两条 1×20 排母（C2897383，BOM 里没有这一行），Pico 上焊排针后插上去，可拔换。USB 口朝斜面上沿，是为了让弯头插头不碰别的零件。", "tips": "先焊两条排母，再焊别的件。排针插进排母、排母放进板孔、套上 Pico，先焊 Pico 上的排针（短头从 Pico 背面插、正面焊），再拔下 Pico 焊排母。装上后 Pico 芯片面朝外，1 脚对方焊盘，USB 朝上沿。插上 Pico、USB 接电脑后量 3V3(OUT) = 3.3 V；ADC_VREF 约 3.07 V 属正常（板上分压负载约 1.1 mA 在 Pico 自带 200 Ω 滤波电阻上掉 0.2 V，比例式读数不受影响）。"}, {"name": "12 V 键灯电源入口", "refs": ["J_12V", "C12A", "C12B"], "text": "按键灯是 12 V 的，Pico 的 3.3 V 带不动，所以单独从 PCB-3 电源板的 J_KEYL 引一根 12 V（W15）进 J_12V（1 脚 +12V、2 脚 GND）。在本板上 +12V 只去两个地方：6 个按键插座的 3 脚（灯的正极）和 U2 ULN2803 的 COM（10 脚）。C12A 47 µF 是储能电容，几盏灯同时点亮时先从它取电，减小 12 V 线上的跌落；C12B 100 nF 滤高频干扰（推断，资料只写了取值）。C12A 原来是 5×11 电解，在背面太高，2026-10-21 改成 5×7 固态电解 C48970594（47 µF/35 V），焊盘不变。本板只有一个 GND 网络，12 V 灯电流和 Pico、按键、编码器共用这片地。另外 2026-10-26 起左边 USB 缺口要加高：焊元件前切掉本地 x 0–24、y 17–20.5 这一条（只有两层接地铺铜，没有走线和元件）。", "tips": "C12A 有极性：外壳色带一侧是负极、长脚是正极（一般标法），正极对丝印 +、接 +12V。切缺口用钢锯或剪钳先开两刀再锉平，别掰；模式开关大孔与缺口之间只剩约 2.5 mm 板筋。切完用万用表确认切口两层铜不和别的网络搭连。不插 Pico 时量 J_12V 的 12 V 能到 U2 的 10 脚。"}, {"name": "按键输入与去抖（6 路）", "refs": ["J_K1", "J_K2", "J_K3", "J_K4", "J_K5", "J_K6", "RKP1", "RKP2", "RKP3", "RKP4", "RKP5", "RKP6", "RKS1", "RKS2", "RKS3", "RKS4", "RKS5", "RKS6", "CK1", "CK2", "CK3", "CK4", "CK5", "CK6"], "text": "6 个带灯按键各接一个 4 针 XH 插座 J_K1–J_K6：1 脚 KEYn（常开触点）、2 脚 GND、3 脚 +12V（灯+）、4 脚 LAMPn（灯−）。按键这一半这样工作：RKPn 10 kΩ 把 KEYn 拉到 3.3 V，松开时读到高电平；按下时触点把 KEYn 接地，读到低电平（按下 = 0）。机械触点闭合的一瞬间会来回弹跳好几下（叫抖动），所以中间串 RKSn 1 kΩ、对地并 CKn 100 nF，组成 RC 低通滤波，把抖动抹平再送进 Pico。时间常数：按下时电容经 1 kΩ 放电约 0.1 ms，松开时经 10 k + 1 k 充电约 1.1 ms（推断，按阻容值算）；剩下的由固件再滤（推断）。1 kΩ 还限制了电容放电时流过触点的电流（推断）。对应关系（网表）：J_K1→GP2、J_K2→GP3、J_K3→GP4、J_K4→GP5、J_K5→GP6、J_K6→GP7。", "tips": "LA16 带灯按钮到货先用万用表确认 NO（常开）触点和灯脚，再压 XH 线；灯如果标“DC 12 V”有极性，+ 接 J_K 的 3 脚。每个 J_K 旁丝印“L 12 G K”（4→1 脚）。测试固件读 GP2–GP7，按下应为 0。"}, {"name": "键灯驱动（ULN2803）", "refs": ["U2", "J_K1", "J_K2", "J_K3", "J_K4", "J_K5", "J_K6"], "text": "Pico 引脚只能输出 3.3 V、几毫安，点不亮 12 V 的灯，所以用 U2 ULN2803 做开关。它里面有 8 个达林顿管（两只三极管叠成一个、放大倍数很大的开关），某路输入给高电平，对应输出就接通到地。接法：灯的 + 常接 +12V，灯的 − 接 LAMPn → U2 的 OUT1–OUT6（18–13 脚）；GP8–GP13（LIN1–LIN6）接 IN1–IN6（1–6 脚）。Pico 输出高 → 这一路导通 → 电流从 12 V 经灯流进 U2 再到地，灯亮；这种接法叫灌电流（低边开关）。IN7、IN8（7、8 脚）不用，直接接地，免得悬空乱动；9 脚是 GND。10 脚 COM 接 +12V：芯片里每路有一只二极管到 COM，负载断开时的反冲电压由它吸收（推断，ULN2803 的常规用法）。实际装的是第一单买的 ULN2803AN237（同为 DIP-18），不是 BOM 上写的 ULN2803APG。", "tips": "U2 是 DIP-18，缺口或圆点那头是 1 脚，对丝印方向。先焊对角两脚确认贴平再焊其余。测试：GP8–GP13 依次拉高，对应 LAMP 灯亮（12 V，ULN2803 灌电流）。"}, {"name": "旋转编码器 ×3", "refs": ["SW1", "SW2", "SW3", "RP1A", "RP1B", "RP1S", "RP2A", "RP2B", "RP2S", "RP3A", "RP3B", "RP3S", "RS1A", "RS1B", "RS1S", "RS2A", "RS2B", "RS2S", "RS3A", "RS3B", "RS3S", "CE1A", "CE1B", "CE1S", "CE2A", "CE2B", "CE2S", "CE3A", "CE3B", "CE3S"], "text": "SW1–SW3 是 EC11E15244B2 编码器：转一圈 30 个定位、15 个脉冲，A、B 两相信号错开四分之一周期，固件看谁先变就知道往哪边转；轴还能按下（D 脚是按压开关）。C、E 两个公共脚和两个安装脚都接地。A、B、按压三个信号处理方式一样：RPxx 10 kΩ 上拉到 3.3 V、RSxx 10 kΩ 串联、CExx 10 nF 对地，这是 Bourns 推荐的去抖接法，触点接通时把线拉低。时间常数约 10 kΩ × 10 nF = 0.1 ms（推断，按阻容值算），能压掉触点毛刺，又远短于手转一格的时间（推断）。位号规则：数字是第几个编码器，A/B/S 是 A 相、B 相、按压。连接（网表）：SW1 的 A/B/按压 → GP14/15/16，SW2 → GP17/18/19，SW3 → GP20/21/22。", "tips": "编码器和推子装在顶层（朝面板），背面全部焊完再焊它们；背面件的脚会穿到顶层，焊前确认编码器底下没有翘起的引脚。CE 系列实际买的是德尔创 C2761727 10 nF 瓷片（BOM 写 C254066），无极性。测试：转一格 A、B 各出一个边沿。"}, {"name": "推子（比例式 ADC）", "refs": ["RV1", "RV2", "RF1", "RF2", "CF1", "CF2"], "text": "RV1、RV2 是 60 mm 直滑电位器（PTA6043，10 kΩ 线性）。两端接 ADC_VREF（1 脚）和 AGND（3 脚），滑片（2 脚，网络 FW1/FW2）的电压随推子位置从 0 线性变到 ADC_VREF。滑片经 RF 1 kΩ、对地 CF 100 nF 滤波后送 GP26/GP27。比例式的意思是：电位器两端和 Pico 的 ADC 用的是同一个参考电压 ADC_VREF，读数只取决于推子位置的比例，参考电压本身偏高偏低都不影响——所以 ADC_VREF 量到 3.07 V 也没关系。RC 时间常数约 0.1 ms，滤掉滑片接触噪声（推断）。推子外壳 4–7 脚接 GND。AGND 是 Pico 33 脚引出的模拟地，本板上它和 GND 没有直接相连（网表如此），模拟小信号的回流不和 12 V 灯电流混在一起（推断）。", "tips": "装在顶层（朝面板），最后焊，长边沿 x。测试：GP26/27 读数随推子 0 → 4095 线性变化。"}, {"name": "模式开关分压链", "refs": ["J_MODE", "RM1", "RM2", "RM3", "RM4", "RM5", "RM6", "RM7", "RMS", "RMD", "CM"], "text": "模式开关是一个多档波段开关，要是每档用一根线读就要占 6 个引脚；这里用电阻分压，只占一路 ADC（GP28）。RM1–RM7 七只 1 kΩ 串在 ADC_VREF 和 AGND 之间，六个抽头 T1–T6 分别是 1/7 … 6/7 的 ADC_VREF。开关触点 0–5 接 J_MODE 2–7 脚 → T1–T6，公共端 C 接 J_MODE 1 脚（MODE_C）。转到触点 k，C 就连到 (k+1)/7 那一点，经 RMS 10 kΩ、CM 100 nF 滤波进 GP28，固件按电压分档。RMD 1 MΩ 把 GP28 拉到 AGND：转动经过两档之间时 C 悬空，读数掉到接近 0，固件当“过渡”忽略，不会误判成某一档。1 MΩ 比 10 kΩ 大得多，正常档位时只让读数偏低很少（推断）。", "tips": "J_MODE 1 脚是公共端 C，2–7 脚依次是触点 0–5，接线前对好开关焊片。到货实测读数稳定性（银触点）。测试：GP28 六档约 1/7 … 6/7 × ADC_VREF，档间接近 0。"}], "parts": {"U1": "Raspberry Pi Pico 主控：读按键、编码器、推子、模式开关，控制键灯；插在两条排母上", "J_DBG": "UART0 调试口：1 GP0（Pico 发）、2 GP1（Pico 收）、3 GND", "C3V": "Pico 3V3(OUT) 上的 100 nF 去耦，给上拉电阻那路 3.3 V 滤毛刺", "J_12V": "键灯 12 V 入口（来自 PCB-3 J_KEYL）：1 +12V、2 GND", "C12A": "12 V 储能 47 µF 固态电解（实装 C48970594 35 V），有极性", "C12B": "12 V 上的 100 nF 高频滤波", "U2": "ULN2803 八路达林顿：GP8–13 控制 6 盏键灯接地点亮（实装 ULN2803AN237）", "J_MODE": "模式开关插座：1 公共端 C（MODE_C），2–7 脚 = 触点 0–5", "RMS": "模式开关公共端 10 kΩ 串阻，与 CM 组成滤波后进 GP28", "RMD": "GP28 的 1 MΩ 下拉：档与档之间悬空时读数落到接近 0", "CM": "GP28 滤波 100 nF，接 AGND", "J_K1": "K1 按键插座：1 KEY1、2 GND、3 +12V 灯+、4 LAMP1 灯−（U2 18 脚）", "RKP1": "K1 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS1": "K1 按键 1 kΩ 串阻，与 CK1 组成去抖 RC，进 GP2", "CK1": "K1 按键去抖 100 nF 对地电容（GP2 一侧）", "J_K2": "K2 按键插座：1 KEY2、2 GND、3 +12V 灯+、4 LAMP2 灯−（U2 17 脚）", "RKP2": "K2 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS2": "K2 按键 1 kΩ 串阻，与 CK2 组成去抖 RC，进 GP3", "CK2": "K2 按键去抖 100 nF 对地电容（GP3 一侧）", "J_K3": "K3 按键插座：1 KEY3、2 GND、3 +12V 灯+、4 LAMP3 灯−（U2 16 脚）", "RKP3": "K3 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS3": "K3 按键 1 kΩ 串阻，与 CK3 组成去抖 RC，进 GP4", "CK3": "K3 按键去抖 100 nF 对地电容（GP4 一侧）", "J_K4": "K4 按键插座：1 KEY4、2 GND、3 +12V 灯+、4 LAMP4 灯−（U2 15 脚）", "RKP4": "K4 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS4": "K4 按键 1 kΩ 串阻，与 CK4 组成去抖 RC，进 GP5", "CK4": "K4 按键去抖 100 nF 对地电容（GP5 一侧）", "J_K5": "K5 按键插座：1 KEY5、2 GND、3 +12V 灯+、4 LAMP5 灯−（U2 14 脚）", "RKP5": "K5 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS5": "K5 按键 1 kΩ 串阻，与 CK5 组成去抖 RC，进 GP6", "CK5": "K5 按键去抖 100 nF 对地电容（GP6 一侧）", "J_K6": "K6 按键插座：1 KEY6、2 GND、3 +12V 灯+、4 LAMP6 灯−（U2 13 脚）", "RKP6": "K6 按键 10 kΩ 上拉到 3.3 V，松开读高、按下读低", "RKS6": "K6 按键 1 kΩ 串阻，与 CK6 组成去抖 RC，进 GP7", "CK6": "K6 按键去抖 100 nF 对地电容（GP7 一侧）", "SW1": "编码器 1（EC11）：A/B → GP14/GP15，按压 → GP16；装正面", "RP1A": "编码器 1 A 相 10 kΩ 上拉到 3.3 V", "RS1A": "编码器 1 A 相 10 kΩ 串阻，与 CE1A 去抖，进 GP14", "CE1A": "编码器 1 A 相 去抖 10 nF 对地（GP14 一侧）", "RP1B": "编码器 1 B 相 10 kΩ 上拉到 3.3 V", "RS1B": "编码器 1 B 相 10 kΩ 串阻，与 CE1B 去抖，进 GP15", "CE1B": "编码器 1 B 相 去抖 10 nF 对地（GP15 一侧）", "RP1S": "编码器 1 按压 10 kΩ 上拉到 3.3 V", "RS1S": "编码器 1 按压 10 kΩ 串阻，与 CE1S 去抖，进 GP16", "CE1S": "编码器 1 按压 去抖 10 nF 对地（GP16 一侧）", "SW2": "编码器 2（EC11）：A/B → GP17/GP18，按压 → GP19；装正面", "RP2A": "编码器 2 A 相 10 kΩ 上拉到 3.3 V", "RS2A": "编码器 2 A 相 10 kΩ 串阻，与 CE2A 去抖，进 GP17", "CE2A": "编码器 2 A 相 去抖 10 nF 对地（GP17 一侧）", "RP2B": "编码器 2 B 相 10 kΩ 上拉到 3.3 V", "RS2B": "编码器 2 B 相 10 kΩ 串阻，与 CE2B 去抖，进 GP18", "CE2B": "编码器 2 B 相 去抖 10 nF 对地（GP18 一侧）", "RP2S": "编码器 2 按压 10 kΩ 上拉到 3.3 V", "RS2S": "编码器 2 按压 10 kΩ 串阻，与 CE2S 去抖，进 GP19", "CE2S": "编码器 2 按压 去抖 10 nF 对地（GP19 一侧）", "SW3": "编码器 3（EC11）：A/B → GP20/GP21，按压 → GP22；装正面", "RP3A": "编码器 3 A 相 10 kΩ 上拉到 3.3 V", "RS3A": "编码器 3 A 相 10 kΩ 串阻，与 CE3A 去抖，进 GP20", "CE3A": "编码器 3 A 相 去抖 10 nF 对地（GP20 一侧）", "RP3B": "编码器 3 B 相 10 kΩ 上拉到 3.3 V", "RS3B": "编码器 3 B 相 10 kΩ 串阻，与 CE3B 去抖，进 GP21", "CE3B": "编码器 3 B 相 去抖 10 nF 对地（GP21 一侧）", "RP3S": "编码器 3 按压 10 kΩ 上拉到 3.3 V", "RS3S": "编码器 3 按压 10 kΩ 串阻，与 CE3S 去抖，进 GP22", "CE3S": "编码器 3 按压 去抖 10 nF 对地（GP22 一侧）", "RV1": "推子 1（60 mm 直滑 10 kΩ 线性），滑片电压 → GP26；装正面", "RF1": "推子 1 滑片 1 kΩ 串阻，与 CF1 低通后进 GP26", "CF1": "推子 1 滤波 100 nF，接 AGND", "RV2": "推子 2（60 mm 直滑 10 kΩ 线性），滑片电压 → GP27；装正面", "RF2": "推子 2 滑片 1 kΩ 串阻，与 CF2 低通后进 GP27", "CF2": "推子 2 滤波 100 nF，接 AGND", "RM1": "分压链 1 kΩ（AGND–T1），T1 = 1/7 VREF（触点 0）", "RM2": "分压链 1 kΩ（T1–T2），T2 = 2/7 VREF（触点 1）", "RM3": "分压链 1 kΩ（T2–T3），T3 = 3/7 VREF（触点 2）", "RM4": "分压链 1 kΩ（T3–T4），T4 = 4/7 VREF（触点 3）", "RM5": "分压链 1 kΩ（T4–T5），T5 = 5/7 VREF（触点 4）", "RM6": "分压链 1 kΩ（T5–T6），T6 = 6/7 VREF（触点 5）", "RM7": "分压链 1 kΩ（T6–ADC_VREF），接到 ADC_VREF 顶端"}}, NS = 'http://www.w3.org/2000/svg', KEY = 'solder:' + D.board;
// 电路分块：每块做成和料组一样的 {des, side} 对象，选中时板上高亮
const BLOCKS = N ? N.blocks.map(b => ({...b, des: b.refs, side: [...new Set(b.refs.map(r => (D.parts[r] || {}).side).filter(Boolean))]})) : [];
const blocksOf = des => BLOCKS.filter(b => b.refs.includes(des));
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
let side = 'T', active = null;
const padsG = document.getElementById('pads'), boxesG = document.getElementById('boxes');
const padEls = {};
for (const [des, p] of Object.entries(D.parts)) {
  padEls[des] = [];
  const minN = p.pads.reduce((m, q) => (/^\d+$/.test(q.n) && (m === null || +q.n < m)) ? +q.n : m, null);
  for (const q of p.pads) {

bTop.onclick = () => { side = 'T'; render(); }; bBot.onclick = () => { side = 'B'; render(); };

const svg = document.getElementById('svg'); let vb = svg.getAttribute('viewBox').split(' ').map(Number), drag = null;
