<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IV18 D1 焊接图</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--muted:#6b6a64;--card:#fff;--line:#dcdad3;--pcb:#0f4d2c;--silk:#f3f1e8;--pad:#c9a646;--hl:#e8483b;--done:#9a9890}
@media (prefers-color-scheme: dark){:root{--bg:#161614;--fg:#ecebe6;--muted:#9a9890;--card:#1f1f1c;--line:#34332f;--pcb:#0d3d24;--silk:#e9e6da;--pad:#b8963c;--hl:#ff6a5c;--done:#6b6a64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:17px;margin:0}.note{color:var(--muted);font-size:13px;flex-basis:100%}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn.on{background:var(--fg);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);height:calc(100vh - 62px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#view{height:60vh}}
#view{background:var(--pcb);position:relative;overflow:hidden}svg{width:100%;height:100%}
.ol{fill:none;stroke:#ffd84a;stroke-linecap:round}.olf{fill:none}
.st,.sb{fill:none;stroke:var(--silk);stroke-linecap:round;stroke-linejoin:round;opacity:.85}.stf,.sbf{fill:var(--silk);opacity:.85}
.pad{fill:var(--pad);opacity:.9}.pad.hole{stroke:#000;stroke-opacity:.35;stroke-width:.15}
.pad.p1{fill:#e2c25a}.pad.dim{opacity:.25}.pad.sel{fill:var(--hl);opacity:1}
.box{fill:none;stroke:var(--hl);stroke-width:.35;stroke-dasharray:1 .6}
#list{overflow:auto;border-left:1px solid var(--line)}
.grp{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.grp:hover{background:var(--card)}.grp.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}
.grp .v{font-weight:600}.grp .d{grid-column:2;color:var(--muted);font-size:12.5px;word-break:break-all}
.grp .m{grid-column:2;color:var(--muted);font-size:12px}
.grp.done .v,.grp.done .d{color:var(--done);text-decoration:line-through}
.grp.skip{opacity:.55}.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.grp .loc{grid-column:2;font-size:12.5px}.cell{display:inline-block;font-weight:700;border:1px solid var(--fg);border-radius:4px;padding:0 5px;margin-right:4px}
.loc .warn{color:var(--hl)}.loc .q{color:var(--muted)}
.ov{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.blk{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.blk:hover{background:var(--card)}
.blk.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}.blk .bn{font-weight:600}.blk .bc{color:var(--muted);font-size:12px;margin-left:6px}
.blk .bt,.grp .ex{display:none;font-size:13px;line-height:1.6;margin-top:4px;white-space:pre-wrap}
.blk.act .bt{display:block}.grp.act .ex{display:block;grid-column:2}
.tips{display:block;margin-top:4px;color:var(--hl)}.ex .pd{display:block}.ex .pd b{font-weight:600}
.chip{display:inline-block;font-size:12px;border:1px solid var(--hl);color:var(--hl);border-radius:10px;padding:0 7px;margin:4px 4px 0 0;cursor:pointer}
.sec.tg{cursor:pointer}
.sec{padding:6px 12px;font-size:12px;color:var(--muted);background:var(--bg);position:sticky;top:0;border-bottom:1px solid var(--line)}
#tip{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>IV18 D1 焊接图</h1>
<button class="btn on" id="bTop">正面（顶层）</button><button class="btn" id="bBot">背面（底层，镜像）</button>
<button class="btn" id="bSort">按格子排</button><span id="prog" style="color:var(--muted)"></span>
<div class="note">点右侧一行：板上对应位置变红。勾选＝这一组焊完了（存在本机浏览器里）。方焊盘/偏亮的焊盘是 1 脚。方框里是元件柜格子（“按格子排”可以一格一格取料）。点开一行能看到每个元件的作用；最上面“电路说明”讲每一块电路的原理，点一块板上就高亮那一块；点板上的焊盘会跳到它那一行。贴片件钢网刷锡膏 + 加热台回流（2026-10-23 起不交嘉立创贴）；MAX6921（U1）1 脚对丝印圆点；R17–R19 不焊（тип 2 管）。直插件焊完把板底焊脚剪平到 ≤ 0.8 mm。</div></header>

24V 只给升压模块，经本板开关。C7 22 µF 是 +5V 入口储能电容（原设计 100 µF 电解，管后限高 10 mm 改成 1206 陶瓷）。TP1–TP5 是单针排针做的测试针：TP1 = VBB、TP2 = +5V_FIL、TP3 = FIL_OK、TP4 = BLANK_IC、TP5 = GND（TP5 位号丝印放不下，按板上说明认）。", "tips": "J1、J2、TP1–TP5 是直插件，等贴片件回流完再用烙铁焊（推断：加热台会把整板加热）。焊完把板底焊脚剪平到 ≤0.8 mm：板下只有 1 mm 尼龙垫片，也不能换厚垫（管顶再抬 0.5 mm 就碰 IN-14 小板）。插拔 J1 前先断 24 V。第一次上电（不装端板、不插管、J2 不接）：TP2 = 0 V、TP4 = 3.3 V、J2-1 = 0 V。"}, {"name": "MAX6921 栅/段驱动", "refs": ["U1", "C1", "C2", "R11", "R12", "R13", "R17", "R18", "R19", "TP4"], "text": "一位数字要亮，需要它的栅极为正、同时笔段阳极为正。IV-18 的 9 个栅和 8 个段在管内各自并联，ESP 每次只开一个栅并给出这一位的段，每位约 1 ms 轮流，看起来 9 位同时亮，这叫扫描。U1 MAX6921 有 20 路高压输出：ESP 从 DIN/CLK 移入 20 位，LOAD 给一个正脉冲（高电平透明、下降沿锁存）后输出更新，每路接 VBB 或接地。OUT0–8 = G1–G9（26–18 脚），OUT9–16 = a b c d e f g dp，经端板到管脚。BLANK（13 脚）为高时全部关断：R12 47 k 上拉到 3V3（默认熄屏），ESP 的 BLANK 经 R11 1 k 进来，好让 Q4 能压过 ESP。R13 100 k 让 LOAD 平时为低，否则移位时输出跟着乱跳。VCC 用常有电的 3V3：输入门限是 0.8×VCC，且 VCC 没电时不能驱动输入。C1/C2 是 VCC 去耦。R17–R19 只给 тип 1 管，本机 тип 2 不焊。", "tips": "U1 是淘宝自购件，上板前按测试清单 8a 在测试座里单独测真伪。1 脚标记对准丝印，回流后放大镜查 1.27 mm 脚间连锡。R17–R19 焊盘不刷锡膏、不焊（固件 IV18_TYPE=2）。PWR_EN 低时 TP4 应为 3.3 V。VBB、G、SEG 一带焊完洗净刷三防漆（35 V 段线最近只有 0.1 mm）。扫描跑起来后示波器看 G1–G9：每位约 1 ms、换位消隐 ≥5 µs、同一时刻只有一个栅为高。"}, {"name": "24 V 开关（给升压模块）", "refs": ["Q1", "Q2", "R1", "R2", "R3", "R4", "R14", "D1", "C11", "J2"], "text": "35 V 由板外 XL6009 升压模块产生。升压电路不工作时输入会经电感和二极管直通到输出（约 23.5 V），所以要关 35 V 只能切断模块的 24 V 输入，这就是本块的作用。Q1 NCE40P05Y 是 P 沟道 MOS 管（栅极比源极低够多才导通）：源极接 +24V，漏极 +24V_SW 经 J2-1 去模块。Q2 BSS138 是 N 沟道 MOS 管：IV18_PWR_EN 为 3.3 V 时经 R3 1 k 使 Q2 导通，R1/R2 两只 47 k 把 24 V 分一半，Q1 栅源约 −12 V 导通；D1 12 V 稳压管跨在栅源（阴极接 +24V）兜底钳位。PWR_EN 低、ESP 复位或排线拔掉时，R4（Q2 栅）、R14（PWR_EN 线）两只 100 k 下拉让它关断。C11 100 nF 在 +24V 入口。J2（XH-4）：1 = +24V_SW、2 = GND、3 = 模块 35 V 回来（VBB_IN）、4 = GND。", "tips": "D1 色带（阴极）朝 +24V 一侧（网表 D1-1；按 SOD-123 通常 1 脚为阴极推断，与调研“阴极接 S”一致）。Q1–Q4 都是 SOT-23，外形一样，回流前对清位号：Q1 NCE40P05Y、Q2 BSS138、Q3 AO3401A、Q4 MMBT3906。J2 到 XL6009 IN+ 的线上串一只 2.2 Ω 2 W 电阻（套热缩）：不串时开关瞬间给模块电解充电约 19 A，超过 Q1 的 18 A；串后约 7.5 A。PWR_EN 低时 J2-1 = 0 V，高时约 24 V。"}, {"name": "VBB 35 V 滤波与泄放", "refs": ["R5", "R6", "C3", "C4A", "C4B", "TP1", "J2"], "text": "模块送回的 35 V（VBB_IN）先过 R5 10 Ω 再成为 VBB，接 MAX6921 1 脚。R5 限制模块输出对 C4 的冲击电流，35 V×15 mA 时只压降 0.15 V，量它两端电压还能算出 VBB 电流。C4A/C4B 两只 2.2 µF/100 V 陶瓷是储能：规格书要求扫描应用 VBB 另加 ≥1 µF；原设计 22 µF 电解高 11 mm 放不下，改两只 1210。C3 100 nF/100 V 贴 1 脚滤高频。VBB 上电容都选 100 V 留余量。R6 47 k 泄放：关电后放掉电容里的电（35 V 时 0.74 mA、26 mW）。只算板上电容约 0.2 s，但还要放模块输出电解，降到 5 V 以下约 1–8 s，期间 BLANK 已被强制为高。为什么 35 V：原厂规定高于 25 V 时每个栅占空比不得超过 (25/U)²，35 V 时 51 %；9 位扫描每位 11 %，余量大，但某一位常亮就超规格。", "tips": "C3 实装 C106243（国巨 100 V；BOM 的 C28233 无货），必须是 100 V 款。XL6009 模块先空载调到 35 V（先看输出电解耐压，35 V 的换 50 V 以上），点胶后再接 J2；PWR_EN 高时 TP1 ≈ 35 V。量 TP1 时地线夹 TP5，别让表笔把相邻焊盘短路。装管后先在 25–30 V 下看，再调到 35 V。"}, {"name": "灯丝交流驱动", "refs": ["U2", "U3", "C5", "C6", "C12", "R15", "R16"], "text": "IV-18 的灯丝就是阴极，额定 5.0 V（4.3–5.5 V）、85±10 mA。直流加热时两端差 5 V，一端的字会比另一端亮；用 20 kHz 交流让两端轮流高低，平均一致。U2 74HCT132（四路施密特与非门，TTL 门限，3.3 V 可直接驱动）把 IV18_FIL 变成两相：U2C 出反相的 FIL_PH_A，U2D 再反一次得 FIL_PH_B，分别进 U3 L9110（小 H 桥，两路推挽输出）的 IA、IB。OA 经 R15 0 Ω 到管脚 1，OB 经 R16 0 Ω 到管脚 13，两端在 0/5 V 间互补翻转，灯丝平均约 +2.4 V。MAX6921 关断的输出是 0 V，比阴极低约 2.4 V，被关的栅/段就不发光（原厂：比阴极高 2.5–3.0 V 才开始可见）。U3 电源是开关后的 +5V_FIL，C6 100 nF、C12 10 µF 贴芯片；C5 100 nF 是 U2 的去耦（推断）。R15/R16 可换小电阻微调灯丝电压或测电流。", "tips": "U3 必须是 HGSEMI 的 L9110SM（C725348），不要 UMW 料（UMW 规定输入不得高于 VCC，灯丝断电时输入仍有 5 V）。U2、U3 的 1 脚圆点对丝印。测试：在 R15、R16 外侧（T 形焊盘 TA4/TA9）接 56 Ω 1 W 假负载，FIL 开 20 kHz、约 20 ms 后 PWR_EN 高，示波器看互补方波，幅值预计 4.0–4.5 V（万用表交流档测不准）。装管后量 1、13 脚间幅值目标 4.3–5 V，电流 85±10 mA。"}, {"name": "方波检测（电荷泵看门狗）", "refs": ["R7", "C8", "D2", "D3", "C9", "R8", "TP3"], "text": "功能规格 S6 要求：灯丝方波一旦停下，不能长时间通直流，显示也要灭。这里用电荷泵（靠电容来回充放电把交流“泵”成直流电压的小电路）检测 IV18_FIL 是否在翻转。路径：IV18_FIL → R7 220 Ω → C8 10 nF → 节点 FIL_P；D2 BAT43W（肖特基二极管，压降小）把 FIL_P 往下的半周钳到地，D3 把往上的半周送到 FIL_OK；C9 1 µF 存住，R8 47 k 慢慢放电（τ = 47 ms）。仿真：方波 20 kHz 时 FIL_OK 升到 1.9 V（74HCT132 门限上限）用 5.2 ms，稳态 2.70–2.76 V；方波停在高或停在低，18–80 ms 内降到门限以下，满足 ≤100 ms。所以固件要比 IV18_PWR_EN 至少早 10 ms 开 FIL（固件 FIL_LEAD_MS = 20）。频率低于 10 kHz 时泵不够，会断灯丝；要用低频得把 C8 换 100 nF。", "tips": "D2、D3 方向：D2 阴极接 FIL_P、阳极接地；D3 阳极接 FIL_P、阴极接 FIL_OK（网表 D2-1、D3-1 为阴极，推断按 SOD-123 1 脚 = 阴极）。C9 实装 C91185（国巨 1 µF）。测：FIL 开 20 kHz 时 TP3 约 2.7 V；停 FIL 后逐渐下降。"}, {"name": "灯丝电源开关与强制熄屏", "refs": ["U2", "Q3", "R9", "Q4", "R10", "TP2"], "text": "U2A 是一个与非门：只有 IV18_PWR_EN 为高并且 FIL_OK 为高（方波在翻转）时，输出 FIL_EN_N 才为低。FIL_EN_N 接 Q3 AO3401A（P 沟道 MOS）的栅极：为低时 Q3 导通，+5V 送到 +5V_FIL 给 L9110；否则 R9 100 k 把栅极拉到源极，Q3 关断，灯丝断电。ESP 复位时 PWR_EN 被下拉，灯丝同样断电。U2B 把 FIL_EN_N 再反相得 FIL_EN，经 R10 10 k 接 Q4 MMBT3906（PNP 三极管，基极比发射极低就导通）：发射极接 3V3，集电极接 BLANK_IC。FIL_EN 为低时 Q4 导通，把 BLANK 拉到 3.3 V，管子全灭；R11 1 k 隔开 ESP，Q4 能压过 ESP 的低电平（约 3.3 mA）。FIL_EN 为 5 V 时 Q4 基射反偏 1.7 V 截止，BLANK 归 ESP 控制。这同时保证 35 V 刚开起来时不会按旧数据静态点亮某一位。", "tips": "Q3 是 AO3401A、Q4 是 MMBT3906，和 Q1/Q2 外形一样别放错。验证：FIL 开、PWR_EN 高 → TP2 ≈ 5 V、TP4 由 ESP 控制；停 FIL（停在高、停在低各试一次）或 PWR_EN 拉低 → 80 ms 内 TP2 掉到 0、TP4 变高。"}], "parts": {"C1": "MAX6921 VCC（3V3）去耦 100 nF，贴 28 脚；实装 C106243", "C2": "3V3 储能 10 µF，与 C1 并联给 MAX6921", "C3": "VBB 高频去耦 100 nF/100 V，贴 U1 1 脚；实装 C106243", "C4A": "VBB 储能 2.2 µF/100 V 陶瓷（与 C4B 并联）", "C4B": "VBB 储能 2.2 µF/100 V 陶瓷（与 C4A 并联）", "C5": "+5V 上 100 nF，U2 74HCT132 去耦（推断）；实装 C106243", "C6": "+5V_FIL 去耦 100 nF，贴 L9110；实装 C106243", "C7": "+5V 入口储能 22 µF 陶瓷", "C8": "电荷泵耦合电容 10 nF", "C9": "FIL_OK 储能 1 µF，与 R8 定 47 ms 衰减；实装 C91185", "C11": "+24V 入口去耦 100 nF；实装 C106243", "C12": "+5V_FIL 储能 10 µF，贴 L9110", "D1": "Q1 栅源 12 V 稳压钳位，阴极接 +24V；实装 C173429", "D2": "电荷泵：把 FIL_P 往下的半周钳到地", "D3": "电荷泵：把 FIL_P 往上的半周送到 FIL_OK", "J1": "XH-14，接 ESP 底板 J_IV18：电源与 6 根控制线", "J2": "XH-4，接板外 XL6009：送出 24V_SW，收回 35 V", "Q1": "P-MOS，24 V 总开关，给 XL6009 模块供电", "Q2": "N-MOS，由 PWR_EN 控制，拉低 Q1 栅极", "Q3": "P-MOS，+5V → +5V_FIL 灯丝电源开关", "Q4": "PNP，灯丝停时把 BLANK_IC 拉高强制熄屏", "R1": "Q1 栅源 47 k，平时让 Q1 关断，并与 R2 分压", "R2": "Q1 栅到 Q2 漏 47 k，分压使栅源约 −12 V", "R3": "Q2 栅极串联 1 k，接 IV18_PWR_EN", "R4": "Q2 栅对地下拉 100 k", "R5": "VBB 串联 10 Ω：限冲击电流，可测 VBB 电流", "R6": "VBB 泄放 47 k，关电后放掉电容电荷", "R7": "电荷泵输入串联 220 Ω", "R8": "FIL_OK 放电 47 k，方波停后让电压下降", "R9": "Q3 栅源上拉 100 k，默认关断灯丝电源", "R10": "Q4 基极电阻 10 k，接   const moved = drag && Math.hypot(e.clientX - drag[0], e.clientY - drag[1]) > 4; drag = null;
  if (moved) return;
  const hit = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.dataset && x.dataset.des);  // 点焊盘：跳到它那一行
  const g = hit && D.groups.find(q => q.des.includes(hit.dataset.des));
  if (!g) return;
  const el = document.getElementById('grp-' + D.groups.indexOf(g));
  if (active !== g) select(g, el);
  el.scrollIntoView({block: 'nearest'});
});
render();
</script></body></html>
