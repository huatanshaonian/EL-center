<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EL-IF D1.3 焊接图</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--muted:#6b6a64;--card:#fff;--line:#dcdad3;--pcb:#0f4d2c;--silk:#f3f1e8;--pad:#c9a646;--hl:#e8483b;--done:#9a9890}
@media (prefers-color-scheme: dark){:root{--bg:#161614;--fg:#ecebe6;--muted:#9a9890;--card:#1f1f1c;--line:#34332f;--pcb:#0d3d24;--silk:#e9e6da;--pad:#b8963c;--hl:#ff6a5c;--done:#6b6a64}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,"Microsoft YaHei",sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:17px;margin:0}.note{color:var(--muted);font-size:13px;flex-basis:100%}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:4px 10px;border-radius:6px;cursor:pointer}
.btn.on{background:var(--fg);color:var(--bg)}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);height:calc(100vh - 62px)}
@media (max-width:820px){main{grid-template-columns:1fr;height:auto}#view{height:60vh}}
#view{background:var(--pcb);position:relative;overflow:hidden}svg{width:100%;height:100%}
.ol{fill:none;stroke:#ffd84a;stroke-linecap:round}.olf{fill:none}
.st,.sb{fill:none;stroke:var(--silk);stroke-linecap:round;stroke-linejoin:round;opacity:.85}.stf,.sbf{fill:var(--silk);opacity:.85}
.pad{fill:var(--pad);opacity:.9}.pad.hole{stroke:#000;stroke-opacity:.35;stroke-width:.15}
.pad.p1{fill:#e2c25a}.pad.dim{opacity:.25}.pad.sel{fill:var(--hl);opacity:1}
.box{fill:none;stroke:var(--hl);stroke-width:.35;stroke-dasharray:1 .6}
#list{overflow:auto;border-left:1px solid var(--line)}
.grp{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.grp:hover{background:var(--card)}.grp.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}
.grp .v{font-weight:600}.grp .d{grid-column:2;color:var(--muted);font-size:12.5px;word-break:break-all}
.grp .m{grid-column:2;color:var(--muted);font-size:12px}
.grp.done .v,.grp.done .d{color:var(--done);text-decoration:line-through}
.grp.skip{opacity:.55}.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.grp .loc{grid-column:2;font-size:12.5px}.cell{display:inline-block;font-weight:700;border:1px solid var(--fg);border-radius:4px;padding:0 5px;margin-right:4px}
.loc .warn{color:var(--hl)}.loc .q{color:var(--muted)}
.ov{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.blk{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.blk:hover{background:var(--card)}
.blk.act{background:var(--card);box-shadow:inset 3px 0 0 var(--hl)}.blk .bn{font-weight:600}.blk .bc{color:var(--muted);font-size:12px;margin-left:6px}
.blk .bt,.grp .ex{display:none;font-size:13px;line-height:1.6;margin-top:4px;white-space:pre-wrap}
.blk.act .bt{display:block}.grp.act .ex{display:block;grid-column:2}
.tips{display:block;margin-top:4px;color:var(--hl)}.ex .pd{display:block}.ex .pd b{font-weight:600}
.chip{display:inline-block;font-size:12px;border:1px solid var(--hl);color:var(--hl);border-radius:10px;padding:0 7px;margin:4px 4px 0 0;cursor:pointer}
.sec.tg{cursor:pointer}
.th{grid-column:3;grid-row:1/span 3;width:80px;height:80px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
.idn{grid-column:2;font-size:12.5px;color:var(--muted)}.band{display:inline-block;width:14px;height:14px;border-radius:2px;border:1px solid #0006;vertical-align:-2px;margin-right:2px}
#pic{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#pic img{max-width:90vw;max-height:90vh;background:#fff;border-radius:6px}
.sec{padding:6px 12px;font-size:12px;color:var(--muted);background:var(--bg);position:sticky;top:0;border-bottom:1px solid var(--line)}
#tip{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:12px}
</style></head><body>
<header><h1>EL-IF D1.3 焊接图</h1>
<button class="btn on" id="bTop">正面（顶层）</button><button class="btn" id="bBot">背面（底层，镜像）</button>
<button class="btn" id="bSort">按格子排</button><span id="prog" style="color:var(--muted)"></span>
<div class="note">点右侧一行：板上对应位置变红。勾选＝这一组焊完了（存在本机浏览器里）。方焊盘/偏亮的焊盘是 1 脚。方框里是元件柜格子（“按格子排”可以一格一格取料）。点开一行能看到每个元件的作用；最上面“电路说明”讲每一块电路的原理，点一块板上就高亮那一块；点板上的焊盘会跳到它那一行。U1/U2（SN74AHCT245N）插在 DIP-20 座上（座子不在 BOM 里，A10后；先焊座子，缺口对丝印缺口）。</div></header>

s": "C", "th": true, "l": "T", "net": "EN_VD"}]}, "PAD29": {"x": 45.5, "y": -81.0, "side": "T", "pads": [{"n": "TP14", "x": 45.5, "y": -81.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "ILM_VD"}]}, "PAD30": {"x": 45.5, "y": -84.0, "side": "T", "pads": [{"n": "TP31", "x": 45.5, "y": -84.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "GND"}]}, "PAD31": {"x": 49.0, "y": -72.0, "side": "T", "pads": [{"n": "TP01", "x": 49.0, "y": -72.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "+5V_IN"}]}, "PAD32": {"x": 49.0, "y": -75.0, "side": "T", "pads": [{"n": "TP02", "x": 49.0, "y": -75.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "+5V_EL"}]}, "PAD33": {"x": 49.0, "y": -78.0, "side": "T", "pads": [{"n": "TP05", "x": 49.0, "y": -78.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "EN_VL"}]}, "PAD34": {"x": 49.0, "y": -81.0, "side": "T", "pads": [{"n": "TP13", "x": 49.0, "y": -81.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "ILM_VL"}]}, "PAD35": {"x": 49.0, "y": -84.0, "side": "T", "pads": [{"n": "TP32", "x": 49.0, "y": -84.0, "w": 2.4, "h": 2.4, "a": 0, "s": "C", "th": true, "l": "T", "net": "GND"}]}}, "hasLoc": true, "copies": 1, "when": "2026-10-27 09:06"}, N = {"board": "EL-IF D1.3", "overview": "EL-IF 是 FPGA 的 Dock 底板和夏普 LJ64K052 EL 屏之间的接口板。信号：Dock 经 P1–P3 三根杜邦线送来 11 路 3.3 V 信号，U1/U2 两片 74AHCT245 转成 5 V，经 J_EL 送到屏的 CN5。电源：PCB-3 经 J_PWR 送来 12 V、5 V，两颗 TPS259470 电子保险软启动、限流后成为屏的 VD（+12V_EL）和 VL（+5V_EL）。其余电路保证 VL→信号→VD 的开机顺序，关机或掉电时 VD 最先关；另有 J_PF 掉电预警/屏幕开关、J_LAMP 指示灯、J_UART 串口。35 个测试点不在 BOM 里。", "blocks": [{"name": "Dock 排针 P1–P3", "refs": ["P1", "P2", "P3"], "text": "三组 2×6 直针分别接 Dock 的 J5、J6、J14，用 2×6 公对母双排杜邦线 1 脚对 1 脚连接。每组 1、2 脚都是 3V3_FPGA（Dock 送来的 3.3 V，只作上拉和小逻辑芯片电源），3、4 脚是 GND。P1 送 8 路像素数据：5 LD3、6 LD1、7 LD2、8 LD0、9 UD0、10 UD3、11 UD1、12 UD2。P2：6 VD_HI_N、8 VD_ON_N、9 CP2、10 OE_N、11 CP1、12 S，5、7 不接。P3：5 UART_TX、7 SCR_EN、8 VD_FLT_N、9 VL_FLT_N、10 VL_OK、11 UART_RX、12 PFAIL_N，6 不接。D1.2 的排针封装是“U 形”编号，与 Dock 的奇偶交错编号不一致，用成排杜邦线直插会把 3V3 短到地；D1.3 已把焊盘改成与 Dock 相同的奇偶编号。设计规定 3V3_FPGA 与任何 5 V/12 V 网络之间不得直接相连。", "tips": "排针短脚插板、塑料座贴紧板面，先焊一针看正再焊其余。丝印“1”旁那针是 1 脚，杜邦线两头都对准“1”，不能调头插。首次上电前用万用表量：P1-1 与 Dock J5-1 通、P1-1 与 P1-3 不通（3V3 与 GND 不短），P2、P3 同样量。FPGA 要烧按 D1.3 脚表改过 .cst 的版本。"}, {"name": "8 路数据电平转换（U1）", "refs": ["U1", "RA1", "RA2", "RA3", "RA4", "RA5", "RA6", "RA7", "RA8", "RPA1", "RPA2", "RPA3", "RPA4", "RPA5", "RPA6", "RPA7", "RPA8", "RB1", "RB2", "RB3", "RB4", "RB5", "RB6", "RB7", "RB8", "RPB1", "RPB2", "RPB3", "RPB4", "RPB5", "RPB6", "RPB7", "RPB8"], "text": "屏的输入要求高电平 ≥3.5 V，FPGA 只能输出 3.3 V，所以要用缓冲器把电平抬到 5 V。U1 是 SN74AHCT245N：输入按 TTL 门限识别，2 V 以上就算高电平，3.3 V 能可靠认出；它由 +5V_EL 供电，输出就是 5 V。DIR（1 脚）接 +5V_EL，方向固定 A→B。每一路的路径：P1 针 → RA 1 kΩ → U1 的 A 脚 → B 脚 → RB 33 Ω → J_EL。RA 的作用：缓冲器还没电而 FPGA 已输出 3.3 V 时，电流会经芯片输入保护结构倒灌，1 kΩ 把它限在约 3 mA 以内，与约 4 pF 输入电容只带来约 4 ns 延迟。RPA 100 kΩ 下拉保证 Dock 断电时输入为低。RB（串联电阻，减缓边沿、压住线束上的振铃）是试值，屏内每路已有 390 Ω 串阻，最终值按屏端波形在 33/47/68/82/100 Ω 中选。RPB 100 kΩ 在屏端下拉，缓冲器关闭时屏输入不会悬空。", "tips": "U1 建议先焊 DIP-20 座再插芯片，缺口/圆点对丝印 1 脚。四排轴向电阻的位号印在电阻本体位置下面，焊前先认清：RA 1 kΩ、RB 33 Ω、RPA/RPB 100 kΩ 外形一样，按色环（五环 1 kΩ 棕黑黑棕、33 Ω 橙橙黑金、100 kΩ 棕黑黑橙）或万用表分清。接屏前先不接屏，烧 el_test，用示波器在 TP15–TP22 看 8 路数据是 5 V 方波。"}, {"name": "时钟与扫描信号（U2）", "refs": ["U2", "RA9", "RA10", "RA11", "RPA9", "RPA10", "RPA11", "RB9", "RB10", "RB11", "RPB9", "RPB10", "RPB11"], "text": "U2 同样是 SN74AHCT245N，只用前三路：A1/B1 = CP2（数据时钟，屏在它的下降沿采样 UD/LD），A2/B2 = CP1（下降沿锁存一行并推进扫描），A3/B3 = S（扫描起始）。没用的 A4–A8（5–9 脚）直接接地，避免输入悬空乱翻；B4–B8 不接。串阻和下拉结构与 U1 相同：P2 → RA9–RA11 1 kΩ → A 脚（RPA 100 kΩ 下拉）；B 脚 → RB9–RB11 → J_EL-9/11/13（RPB 100 kΩ 下拉）。区别是这三路输出串阻取 47 Ω（试值），数据线是 33 Ω；设计记录只给了初值，没写理由，推测是时钟边沿最怕振铃造成误触发（推断）。原厂要求时钟上升/下降时间 ≤30 ns，串阻太大边沿会变慢，所以终值要用示波器在屏端看过再定。3.3 V 侧有测试点 TP26/TP27/TP28，5 V 侧是 TP23/TP24/TP25。", "tips": "RB9–RB11 是 47 Ω（五环黄紫黑金），和 RB1–RB8 的 33 Ω 不同，别装混。U2 也用 DIP 座，方向同 U1。"}, {"name": "缓冲器使能与供电去耦", "refs": ["ROE", "C1", "C2", "C3", "U1", "U2"], "text": "两片 245 的 /OE（19 脚，低电平有效：为低时输出打开）都接 OE_N，由 FPGA 经 P2-10 控制，ROE 10 kΩ 上拉到 3V3_FPGA。FPGA 还在配置、引脚处于弱上拉时，/OE 为高，缓冲器输出关闭；Dock 断电时 /OE 虽然变低，但 A 侧全被下拉为 0，输出恒低，等于“无信号”。缓冲器电源接 +5V_EL（屏自己的 VL），屏的 VL 没电时缓冲器也没电，输出不可能高于 VL，天然满足屏厂“信号不超过 VL+0.3 V”和“VL 先于信号”的要求，所以 /OE 不需要再和 VL 做硬件与门。C1、C2 各 100 nF 紧靠两片的 20/10 脚，是去耦电容（就近提供芯片开关瞬间的电流，减少电源噪声）；C3 是一只库存 10 µF/50 V 电解，两片共用的局部储能。", "tips": "C3 是电解电容有极性：长脚（正极）接 +5V_EL，外壳白条一侧（负极）接 GND，以丝印正负号为准。C1/C2 瓷片无极性。正常流程是 FPGA 先输出黑场、读到 VL_OK 和 PFAIL_N 都为高才把 OE_N 置 0，可在 TP09（OE）看到 3.3 V 变 0 V。"}, {"name": "屏幕插座 J_EL 与指示灯 J_LAMP", "refs": ["J_EL", "J_LAMP"], "text": "J_EL 是 Hirose DF11-20DP-2DS 2.0 mm 双排弯插座，与屏上的 CN5 同型号；线束两端都用 DF11-20DS-2C 壳，按针号 1↔1 直连，屏规格要求线长 ≤50 cm、所有信号/电源/地针都要接。针定义与 CN5 完全一致：1 UD1、2 UD0、3 UD3、4 UD2、5 LD1、6 LD0、7 LD3、8 LD2、9 CP2、11 CP1、13 S；10、12、14、15、16 为 GND；17、18 为 +5V_EL；19、20 为 +12V_EL。两路电源各用两针并联，DF11 端子每针 2 A，VD 最大 1.8 A 有余量。CN5 上带 +12 V，方向错了可能直接损坏屏的逻辑电路。J_LAMP 是 XH 2 针座，1 脚 +12V_EL、2 脚 GND，接面板“屏幕供电”黄色 12 V 指示灯，屏的 VD 打开时才亮。", "tips": "J_EL 是弯插件，开口朝右板边，焊前确认塑壳贴紧板面、两排针都穿出。接屏前必须对照实物确认屏线 1 脚方向（面包板文档里的图只是编号示意）。屏内部有约 200 V 交流脉冲，断电后也可能残留，禁止带电插拔屏线。"}, {"name": "电源输入与浪涌保护", "refs": ["J_PWR", "DTV5", "DTV12", "C5IN", "CB5IN", "C12IN", "CB12IN"], "text": "J_PWR 是 5.08 mm 4 针螺丝端子，接 PCB-3 电源板：1 +12V_IN、2 GND、3 +5V_IN、4 GND（12 V 来自 NID100-12，5 V 来自 NID100-5）。两路各有一只直插单向 TVS（瞬态抑制二极管，电压超过一定值时迅速导通，把尖峰吸掉）：DTV12 用 P6KE15A，DTV5 用 P6KE6.8A，阴极接输入、阳极接地。设计记录写明：TVS 只负责保护后面的电子保险本身，屏端过压靠电子保险的过压切断（OVLO）来挡；P6KE15A 在规定测试条件下钳位 21.2 V（10/1000 µs）/27.2 V（8/20 µs）。C12IN/C5IN 各 10 µF、CB12IN/CB5IN 各 100 nF 是电子保险输入端的储能和高频滤波。板上还预留 CBULK12、CBULK5 两只电解位（默认不焊，不在 BOM）：明纬模块对外接电容总量有上限，要先做总电容预算再决定。", "tips": "TVS 有色环的一端是阴极，朝接 +12V_IN/+5V_IN 的焊盘，以丝印为准；DTV5 和 DTV12 外形一样，型号别装反。接线前确认端子 1 脚是 12 V、3 脚是 5 V，接反会把 12 V 加到 5 V 路（推断会烧 DTV5）。第一次上电用限流电源单独加，TP01（5I）、TP03（12I）应等于输入电压。"}, {"name": "VL 5 V 电子保险（U_VL）", "refs": ["U_VL", "RUV1", "RUV2", "ROV51", "ROV52", "RIL5", "CDV5A", "CDV5B", "C5OUT", "CB5OUT", "DNEG5", "RVLFP"], "text": "U_VL 是 TI TPS259470L 锁存型电子保险（eFuse：带软启动、限流、过压切断的电子开关，出故障就断开并保持断开），把 +5V_IN 变成屏的 +5V_EL。要软启动是因为屏内有 800 mA/1.6 A 慢断保险，原厂提醒大电源直接接上，冲击电流可能把它熔断。开启：RUV1 27 k/RUV2 10 k 从 +5V_IN 分压到 EN，1.2×(1+27/10)≈4.44 V 自动开，VL 不受 FPGA 控制。过压：ROV51 36 k/ROV52 10 k，约 5.52 V 断开，低于屏 VL 绝对最大 7 V。限流：RIL5 4.3 k，3334/4300≈0.78 A。软启动：CDV5A、CDV5B 并联 2 nF，约 1 V/ms，5 V 约 5 ms。DNEG5 吸收关断时的负向尖峰。FLT 是开漏输出（只能把线拉低，高电平靠上拉电阻），经 RVLFP 上拉成 VL_FLT_N_3V3 送 FPGA。ILM 脚兼作电流监测，引到 TP13。", "tips": "U_VL/U_VD 是 2×2 mm、0.45 mm 脚距的 VQFN-10，全板最难焊：钢网刷锡膏后按 1 脚标记放正，回流后用放大镜查相邻脚是否连锡。贴片件全部先回流，再焊直插件。第一次上电不接屏、不接 Dock，只加 5 V：TP05（ENVL）按分压推算约 1.35 V，TP02（5E）应约 5 V。EN 取自输入分压，锁存故障要断开 +5V_IN 重新上电才恢复（推断）。"}, {"name": "VD 12 V 电子保险（U_VD）", "refs": ["U_VD", "ROV121", "ROV122", "RIL12", "CDV12", "C12OUT", "CB12OUT", "DNEG12", "RFLT"], "text": "U_VD 与 U_VL 同型号，把 +12V_IN 变成屏的 +12V_EL（VD，屏耗电的大头，最大 1.8 A）。它的 EN 不接输入分压，而接 EN_VD，由开关逻辑决定何时开：EN_VD 约 3 V 开，被拉到约 0.3 V 关。过压：ROV121 100 k/ROV122 10 k，1.2×11=13.2 V，低于屏 VD 绝对最大 14 V。限流：RIL12 1.2 k，3334/1200≈2.78 A。软启动：CDV12 2.7 nF，约 0.74 V/ms，12 V 约 16 ms。锁存故障要 EN 低于 0.45–0.74 V 才清除，FPGA 置 VD_ON_N=1 时 EN_VD 经 100 k 下拉到约 0 V 即复位。DNEG12 吸收负向尖峰；FLT 经 RFLT 上拉成 VD_FLT_N_3V3 送 FPGA，ILM 引到 TP14。预留的主动放电电路（U_INV、Q_DIS、R_DIS 等）默认不焊，等实测 VD 衰减再定。", "tips": "单独加 12 V 时 VD 不应自己打开：TP04（12E）约 0 V、TP06（ENVD）约 0 V。只有 Dock 上电、FPGA 置 VD_ON_N=0 且 VL 正常时才开。验证 eFuse 先不接屏，用可调电源加电阻负载。CDV12 实际买的是国巨同规格 NP0 0805（C520075），不是 BOM 写的 TDK。"}, {"name": "VL 欠压监控（U_SUP）", "refs": ["U_SUP", "RVS1", "RVS2", "RVS3", "RVOK", "CSUP", "D2"], "text": "U_SUP 是 TPS3808G01 电压监控芯片，告诉 FPGA 和 VD 开关逻辑“屏的 5 V 够不够”。+5V_EL 经 RVS1 100 k、RVS2 1.2 k、RVS3 10 k 分压送 SENSE 脚，芯片内部门限 0.405 V，对应 0.405×(100+1.2+10)/10≈4.50 V。+5V_EL 高于约 4.50 V 时开漏输出松开，RVOK 10 k 把 VL_OK_3V3 上拉到 3.3 V（经 P3-10 给 FPGA）；低于时输出拉低，D2（BAT54WS 肖特基，阴极接 VL_OK、阳极接 EN_VD）把 EN_VD 钳到约 0.3 V，直接关 VD。U_SUP 的电源取自 3V3_FPGA（CSUP 去耦），不是 +5V_EL，所以 VL 完全为 0 时只要 Dock 有电，它照样能报欠压。MR 手动复位接高不用，CT 不接（标称 20 ms 延时）。这个 4.50 V 只是欠压/存在指示，不能证明 VL 在 4.75–5.25 V 正常范围内。", "tips": "U_SUP 是 SOT-23-6，回流前核对 1 脚方向。D2 色带（阴极）朝 VL_OK 一侧，以丝印为准。上电后 TP07（VLOK）应为 3.3 V；把 +5V_IN 慢慢调低，+5V_EL 低于约 4.5 V 时 TP07 变 0 V。"}, {"name": "VD 开关逻辑（或非门 + VL 存在检测）", "refs": ["U_NOR", "CNOR", "RVDP", "Q_VL", "RVGU", "RVGD", "RVAP", "REN", "REND", "D2", "D3", "D4"], "text": "屏厂要求上电 VL→信号→VD、下电反过来，所以 VD 只有在所有条件都满足时才能开。核心是 U_NOR（74LVC1G02 两输入或非门：两个输入都为低时输出才为高），由 3V3_FPGA 供电。输入 A 是 FPGA 的 VD_ON_N（低=请求开 VD），RVDP 10 k 上拉，不驱动时默认不开。输入 B 是 VL_ABSENT：Q_VL（AO3400A N 沟道 MOS 管）的栅极由 +5V_EL 经 RVGU/RVGD 分压得约 2.5 V，VL 有电时导通把 VL_ABSENT 拉低；VL 没电时截止，RVAP 把它拉高，禁止开 VD。或非门输出经 REN 10 k 到 EN_VD，REND 100 k 下拉，开 VD 时 EN_VD≈3 V。EN_VD 上还挂 D2（VL 欠压）、D3（PFAIL）、D4（屏幕开关），任一为低都把 EN_VD 钳到约 0.3 V；REN 让二极管拉得动它（推断）。Dock 断电时或非门没电，EN_VD 靠 REND 为低，VD 也关。", "tips": "Q_VL 是 SOT-23 三脚、U_NOR 是 SOT-23-5，回流前看清方向。U_NOR 实际买的是 UMW 同型号同脚位（C7394016），印字和 TI 不同。D2/D3/D4 阴极（色带）分别接 VL_OK、PFAIL_N、SCR_EN，阳极接 EN_VD。测 TP06（ENVD）：VD 关时约 0 V 或约 0.3 V，开时约 3 V；TP12（VDON）是 VD_ON_N。"}, {"name": "掉电预警与屏幕开关输入（J_PF）", "refs": ["J_PF", "RPF", "D3", "RSCR", "D4"], "text": "J_PF 是 HCTL XH-3A 三针座，用 3 芯 1↔1 直连线接 PCB-3：1 PFAIL_N、2 SCR_EN、3 GND。PFAIL_N 来自 PCB-3 的比较器（开漏），24 V 跌到约 21 V 时变低，表示市电已断、电快没了。RPF 10 k 上拉到 3V3_FPGA 形成 PFAIL_N_3V3：一路送 FPGA（P3-12），一路经 D3 把 EN_VD 拉低，不等 FPGA 就硬件关 VD，保证“VD 先关”。2 脚 SCR_EN 是斜面“屏幕”钮子开关（经 PCB-3 转来，拨下闭合接地 = 关屏），RSCR 10 k 上拉；关屏时经 D4 硬件关 VD，同时送 FPGA（P3-7）走待机流程。J_PF 不插时两路都为高：允许开屏，但也没有掉电保护，这是已知并接受的行为。D1.3 把 J_PF 换成与 PCB-3 同款 HCTL 座：原来两头封装朝向相反，1↔1 线会把 PFAIL_N 接到 GND，屏永远不亮。", "tips": "J_PF 与 J_UART 都是 XH-3A，位置别搞混。上电前量：EL-IF J_PF-3 与 PCB-3 GND 通、J_PF-1 与 PCB-3 PFAIL_EL_N 通。整机测试拔 IEC 断 24 V 时，TP10（PF）应先变低、VD 随即关闭。"}, {"name": "VD 余电检测（VD_HI_N）", "refs": ["Q_VH", "RVHU", "RVHD", "RVHP"], "text": "关机时要先关 VD，确认 VD 真的降下来后才能停扫描、最后关 VL，所以 FPGA 需要知道 +12V_EL 还有没有电。这一块与 Q_VL 结构相同：RVHU 100 k/RVHD 33 k 把 +12V_EL 分压到 Q_VH（AO3400A）栅极，12 V 时约 2.98 V，VD 还在时 Q_VH 导通，VD_HI_N 为低；VD 降下去后 Q_VH 截止，RVHP 10 k 把 VD_HI_N 拉到 3.3 V，经 P2-6 送 FPGA。下臂原审查建议 22 k，12 V 时栅压只有 2.16 V，AOS 数据表没有在这个电压下给出导通保证，所以改 33 k：11.4 V 且两电阻误差最不利时仍高于 2.5 V。12 V 只到 MOS 栅极，漏极只接 3.3 V 侧上拉，FPGA 引脚碰不到 12 V。MOS 管开启电压有分散，VD_HI_N 只能粗判，变高后还要再等实测的 T_VD_WAIT。", "tips": "Q_VH 必须是 AOS 的 AO3400A（C20917），替料要重新核阈值。开 VD 后 TP_VDH（VDHI）应约 0 V，关 VD 后随 VD 衰减变回 3.3 V；用示波器同时看 TP04 和 TP_VDH，记下衰减时间，作为定 T_VD_WAIT 的依据。"}, {"name": "调试串口 J_UART", "refs": ["J_UART", "RTX", "RRX"], "text": "J_UART 把 Dock J14 上的 FPGA 串口转到 XH 三针座：1 TX（UART_TX，FPGA→Orange Pi，来自 P3-5）、2 RX（UART_RX，Orange Pi→FPGA，到 P3-11）、3 GND，接 Orange Pi 4 的 UART4（40 针 19、21 脚，/dev/ttyS4），115200 波特率，用来设置二值化阈值、反色、60/120 Hz、超时等。两边电平不一样：Orange Pi 4 排针 IO 是 3.0 V，FPGA 是 3.3 V。RTX 1 kΩ 串在 FPGA 发送方向，把 3.3 V 经 Pi 输入保护二极管倒灌的电流限到 100 Ω 时的 1/10。RRX 1 kΩ 串在接收方向：Pi 先上电、Dock 没上电时，Pi 的 TX 经原来的 100 Ω 最多往 FPGA IO 和 Dock 3V3 灌约 24 mA，D1.3 改为 1 kΩ。1 kΩ 对 115200 波特率没有影响。", "tips": "RTX、RRX 都焊 1 kΩ：网表里这两个器件名仍写着“TH 100Ω”，是 EDA 只改了实例阻值留下的，以 BOM 的 1 kΩ 为准。只开 Dock 不开 Pi 时 Dock 会往 Pi 灌 mA 级电流，两边尽量一起上电。"}], "parts": {"RA1": "UD0 的 FPGA 侧 1 kΩ 串阻（P1-9→U1 A1）：缓冲器没电时限制倒灌电流", "RPA1": "UD0 在 U1 A1 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB1": "UD0 输出 33 Ω 串阻（U1 B1→J_EL-2）：压住振铃，试值待实测", "RPB1": "UD0 屏端 100 kΩ 下拉（J_EL-2）：缓冲关闭时屏输入为低不浮空", "RA2": "UD1 的 FPGA 侧 1 kΩ 串阻（P1-11→U1 A2）：缓冲器没电时限制倒灌电流", "RPA2": "UD1 在 U1 A2 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB2": "UD1 输出 33 Ω 串阻（U1 B2→J_EL-1）：压住振铃，试值待实测", "RPB2": "UD1 屏端 100 kΩ 下拉（J_EL-1）：缓冲关闭时屏输入为低不浮空", "RA3": "UD2 的 FPGA 侧 1 kΩ 串阻（P1-12→U1 A3）：缓冲器没电时限制倒灌电流", "RPA3": "UD2 在 U1 A3 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB3": "UD2 输出 33 Ω 串阻（U1 B3→J_EL-4）：压住振铃，试值待实测", "RPB3": "UD2 屏端 100 kΩ 下拉（J_EL-4）：缓冲关闭时屏输入为低不浮空", "RA4": "UD3 的 FPGA 侧 1 kΩ 串阻（P1-10→U1 A4）：缓冲器没电时限制倒灌电流", "RPA4": "UD3 在 U1 A4 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB4": "UD3 输出 33 Ω 串阻（U1 B4→J_EL-3）：压住振铃，试值待实测", "RPB4": "UD3 屏端 100 kΩ 下拉（J_EL-3）：缓冲关闭时屏输入为低不浮空", "RA5": "LD0 的 FPGA 侧 1 kΩ 串阻（P1-8→U1 A5）：缓冲器没电时限制倒灌电流", "RPA5": "LD0 在 U1 A5 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB5": "LD0 输出 33 Ω 串阻（U1 B5→J_EL-6）：压住振铃，试值待实测", "RPB5": "LD0 屏端 100 kΩ 下拉（J_EL-6）：缓冲关闭时屏输入为低不浮空", "RA6": "LD1 的 FPGA 侧 1 kΩ 串阻（P1-6→U1 A6）：缓冲器没电时限制倒灌电流", "RPA6": "LD1 在 U1 A6 脚的 100 kΩ 下拉：Dock 断电时输入确定为低", "RB6": "LD1 输出 33 Ω 串阻（U1 B6→J_EL-5）：压住振铃，试值待实测", "RPB6": "LD1 屏端 100 kΩ 下拉（J_EL-5）：缓冲关闭时屏输入为低不浮空",   bTop.classList.toggle('on', side === 'T'); bBot.classList.toggle('on', side === 'B');
  for (const [des, els] of Object.entries(padEls)) for (const e of els) e.style.display = (e.dataset.side === 'B' || e.dataset.side === side) ? '' : 'none';
  const sel = new Set(active ? active.des : []);
